<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bench Boost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDF3F8; --card:#FFFFFF; --ink:#1B2A4A; --muted:#566781; --line:#D5DFEA; --soft:#E4F3FB;
    --bar:#1B2A4A; --blue:#1CA7EC; --teal:#128B93; --orange:#FF6B35; --yellow:#FFC107; --green:#2F9E55; --red:#D9434A; --purple:#7D57C9;
    --goodbg:#E2F5E8; --goodink:#1C6134; --badbg:#FDE8E8; --badink:#8F2328;
    --head:'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
    --body:'Atkinson Hyperlegible', Verdana, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1828; --card:#172338; --ink:#EAF1FA; --muted:#A3B3CB; --line:#2A3B58; --soft:#1B3048;
      --bar:#0A1220; --goodbg:#163A25; --goodink:#A8E6BD; --badbg:#3E1C20; --badink:#F4B4B7;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1828; --card:#172338; --ink:#EAF1FA; --muted:#A3B3CB; --line:#2A3B58; --soft:#1B3048;
    --bar:#0A1220; --goodbg:#163A25; --goodink:#A8E6BD; --badbg:#3E1C20; --badink:#F4B4B7;
  }
  :root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  *,*::before,*::after{ box-sizing:inherit; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:18px; line-height:1.45; -webkit-font-smoothing:antialiased; }
  button{ font-family:inherit; color:inherit; }
  button:focus-visible, input:focus-visible, textarea:focus-visible{ outline:3px solid var(--blue); outline-offset:3px; }
  img{ max-width:100%; }

  /* top bar */
  .top{ position:sticky; top:0; z-index:5; background:var(--bar); color:#fff; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 18px; padding-top:calc(10px + env(safe-area-inset-top,0px)); margin-top:calc(-1 * env(safe-area-inset-top,0px)); }
  .brand{ display:flex; align-items:center; gap:10px; font-family:var(--head); font-weight:800; font-size:24px; letter-spacing:.2px; }
  .spotlogo{ width:36px; height:36px; border-radius:50%; background:var(--orange); box-shadow:12px 0 0 -4px var(--yellow), 22px 0 0 -8px var(--blue); margin-right:14px; }
  .toptag{ font-size:15px; opacity:.85; }
  .iconbtn{ background:rgba(255,255,255,.12); color:#fff; border:0; border-radius:12px; min-width:48px; height:48px; font-size:21px; cursor:pointer; }
  .iconbtn:hover{ background:rgba(255,255,255,.2); }

  .wrap{ max-width:960px; margin:0 auto; padding:22px 18px 48px; }
  h1{ font-family:var(--head); font-weight:800; font-size:34px; line-height:1.1; margin:4px 0 6px; }
  h2{ font-family:var(--head); font-weight:800; font-size:24px; margin:0 0 10px; }
  .sub{ color:var(--muted); margin:0 0 18px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:22px; padding:20px; margin-bottom:16px; }
  .hint{ color:var(--muted); font-size:15px; margin:8px 0 0; }
  .err{ color:var(--red); font-weight:700; font-size:15px; margin:8px 0 0; }

  /* chips & tiles */
  .chips{ display:flex; flex-wrap:wrap; gap:10px; }
  .chip{ border:2px solid var(--line); background:var(--card); border-radius:999px; padding:10px 18px; font-weight:700; font-size:17px; cursor:pointer; min-height:48px; }
  .chip.on{ background:var(--ink); border-color:var(--ink); color:var(--card); }
  .group{ font-family:var(--head); font-weight:800; font-size:19px; margin:14px 0 8px; }
  .units{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
  .unit{ display:flex; align-items:center; gap:12px; text-align:left; border:2px solid var(--line); background:var(--card); border-radius:16px; padding:12px 14px; font-weight:700; font-size:16px; cursor:pointer; min-height:64px; }
  .unit .ic{ font-size:26px; width:34px; text-align:center; flex-shrink:0; }
  .unit .sol{ display:block; font-weight:400; font-size:13px; color:var(--muted); margin-top:2px; }
  .unit.on{ border-color:var(--teal); background:var(--soft); box-shadow:inset 0 0 0 1px var(--teal); }

  .btn{ border:0; border-radius:16px; padding:15px 22px; font-weight:700; font-size:19px; cursor:pointer; min-height:58px; }
  .btn.go{ background:var(--green); color:#fff; }
  .btn.blue{ background:var(--blue); color:#fff; }
  .btn.plain{ background:var(--card); border:2px solid var(--line); }
  .btn.warn{ background:var(--red); color:#fff; }
  .row{ display:flex; gap:12px; flex-wrap:wrap; }
  .row .btn{ flex:1; min-width:190px; }
  input.text, textarea{ width:100%; font:inherit; font-size:19px; padding:14px 16px; border-radius:14px; border:2px solid var(--line); background:var(--card); color:var(--ink); }
  textarea{ min-height:150px; resize:vertical; }
  .pinset{ max-width:170px; letter-spacing:6px; font-weight:700; }

  /* student home */
  .court{ position:relative; overflow:hidden; background:var(--bar); color:#fff; border-radius:26px; padding:26px 24px 30px; margin-bottom:18px; }
  .court::before{ content:""; position:absolute; right:-70px; top:50%; width:240px; height:240px; transform:translateY(-50%); border:4px solid rgba(255,255,255,.14); border-radius:50%; }
  .court::after{ content:""; position:absolute; right:48px; top:0; bottom:0; width:4px; background:rgba(255,255,255,.14); }
  .court .uic{ font-size:44px; line-height:1; }
  .court h1{ margin-top:8px; }
  .court .band{ opacity:.85; font-size:17px; }
  .court .best{ margin-top:12px; display:inline-block; background:rgba(255,255,255,.12); border-radius:999px; padding:6px 14px; font-size:16px; }
  .modes{ display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:16px; }
  .mode{ border:0; border-radius:26px; padding:26px 22px; text-align:left; color:#fff; cursor:pointer; min-height:200px; display:flex; flex-direction:column; justify-content:flex-end; gap:6px; position:relative; overflow:hidden; }
  .mode .big{ font-size:52px; line-height:1; margin-bottom:auto; }
  .mode .t{ font-family:var(--head); font-size:30px; font-weight:800; line-height:1.05; }
  .mode .d{ font-size:17px; opacity:.95; }
  .mode.quiz{ background:var(--blue); }
  .mode.rep{ background:var(--orange); }
  .mode:hover{ filter:brightness(1.05); }

  /* quiz */
  .qbar{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px; font-weight:700; font-size:18px; }
  .streak{ color:var(--orange); }
  .track{ display:flex; gap:6px; margin-bottom:18px; }
  .track i{ flex:1; height:12px; border-radius:99px; background:var(--line); }
  .track i.ok{ background:var(--green); } .track i.no{ background:var(--red); } .track i.now{ background:var(--blue); }
  .qcard{ padding:24px; }
  .qhead{ display:flex; gap:14px; align-items:flex-start; justify-content:space-between; }
  .qtag{ display:inline-block; background:var(--soft); color:var(--teal); font-weight:700; font-size:15px; border-radius:99px; padding:4px 12px; margin-bottom:10px; }
  .qtext{ font-family:var(--head); font-size:30px; font-weight:700; line-height:1.2; margin:0; }
  .speak{ flex-shrink:0; width:56px; height:56px; border-radius:16px; border:2px solid var(--line); background:var(--card); font-size:25px; cursor:pointer; }
  .answers{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:18px; }
  @media (max-width:640px){ .answers{ grid-template-columns:1fr; } }
  .ans{ border:0; border-radius:20px; padding:16px 18px 16px 14px; min-height:88px; font-weight:700; font-size:21px; line-height:1.25; color:#fff; cursor:pointer; text-align:left; display:flex; align-items:center; gap:14px; }
  .ans .spot{ width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,.28); border:3px solid rgba(255,255,255,.6); display:grid; place-items:center; flex-shrink:0; font-family:var(--head); font-size:20px; }
  .a0{ background:#1B8FD2; } .a1{ background:#E3602D; } .a2{ background:var(--teal); } .a3{ background:var(--purple); }
  .ans.dim{ opacity:.32; }
  .ans.right{ background:var(--green); opacity:1; }
  .ans.wrong{ background:var(--red); opacity:1; }
  .ans:disabled{ cursor:default; }
  .feedback{ margin-top:16px; border-radius:18px; padding:16px 20px; font-size:19px; }
  .feedback.good{ background:var(--goodbg); color:var(--goodink); }
  .feedback.bad{ background:var(--badbg); color:var(--badink); }
  .feedback strong{ display:block; font-family:var(--head); font-size:24px; margin-bottom:2px; }
  .nextrow{ margin-top:14px; }
  .band-k2 .qtext{ font-size:36px; }
  .band-k2 .ans{ font-size:27px; min-height:100px; }

  /* results */
  .stars{ font-size:66px; letter-spacing:8px; text-align:center; margin:6px 0; }
  .stars span{ display:inline-block; animation:pop .5s both; }
  .stars span:nth-child(2){ animation-delay:.18s; } .stars span:nth-child(3){ animation-delay:.36s; }
  .stars .off{ filter:grayscale(1); opacity:.28; }
  @keyframes pop{ 0%{ transform:scale(0); } 70%{ transform:scale(1.25); } 100%{ transform:scale(1); } }
  .center{ text-align:center; }
  .scoreline{ font-family:var(--head); font-size:28px; font-weight:800; }
  .newbest{ display:inline-block; background:var(--yellow); color:#3b2a00; font-weight:700; border-radius:99px; padding:4px 14px; margin-top:8px; }

  /* pin */
  .dots{ display:flex; justify-content:center; gap:16px; margin:14px 0 4px; }
  .dots i{ width:20px; height:20px; border-radius:50%; border:3px solid var(--ink); display:block; }
  .dots i.f{ background:var(--ink); }
  .pad{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:330px; margin:18px auto 0; }
  .pad button{ height:74px; font-size:30px; font-weight:700; border-radius:20px; border:2px solid var(--line); background:var(--card); cursor:pointer; }
  .shake{ animation:shake .4s; }
  @keyframes shake{ 20%,60%{ transform:translateX(-10px); } 40%,80%{ transform:translateX(10px); } }

  /* reporter */
  .choices{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-top:18px; }
  .emo{ border:2px solid var(--line); background:var(--card); border-radius:20px; padding:18px 14px; font-size:24px; font-weight:700; cursor:pointer; min-height:96px; }
  .emo:hover{ border-color:var(--orange); }
  .stepdots{ display:flex; gap:8px; margin-bottom:14px; }
  .stepdots i{ width:34px; height:10px; border-radius:99px; background:var(--line); }
  .stepdots i.done{ background:var(--orange); }

  /* reports */
  .rep-item{ border:1px solid var(--line); border-radius:18px; padding:14px 16px; margin-bottom:10px; background:var(--card); }
  .rep-item .meta{ color:var(--muted); font-size:15px; }
  .rep-item .who{ font-weight:700; font-size:19px; }
  .rep-item dl{ margin:8px 0 0; }
  .rep-item dt{ font-weight:700; margin-top:8px; font-size:16px; color:var(--muted); }
  .rep-item dd{ margin:2px 0 0; }
  .sendbox label{ font-weight:700; display:block; margin:10px 0 6px; }
  .sendbox label:first-of-type{ margin-top:0; }
  .sendok{ background:var(--goodbg); color:var(--goodink); border-radius:14px; padding:14px 16px; margin-top:14px; font-weight:700; }

  .mode{ min-height:170px; }
  .mode.lightning{ background:#7D57C9; } .mode.fact{ background:var(--teal); } .mode.sort{ background:#2F9E55; }
  .timer{ font-family:var(--head); font-size:26px; font-weight:800; color:var(--purple); }
  .claim{ margin-top:18px; background:var(--soft); border-radius:18px; padding:14px 18px; }
  .claim small{ display:block; color:var(--muted); font-size:15px; }
  .claim strong{ font-family:var(--head); font-size:28px; line-height:1.2; }
  .answers.tf{ grid-template-columns:1fr 1fr; }
  .answers.three .ans:last-child{ grid-column:1 / -1; }
  .sortitem{ font-family:var(--head); font-size:34px; font-weight:800; text-align:center; padding:22px 8px 6px; line-height:1.15; }
  .linkbtn{ background:none; border:0; padding:10px 0; min-height:44px; font:inherit; color:var(--ink); text-decoration:underline; cursor:pointer; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";

/* ---------- storage (per-device, optional) ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('sq_'+k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('sq_'+k, JSON.stringify(v)); }catch(e){} }
};

const BANDS = { k2:"Grades K–2", g35:"Grades 3–5", g68:"Grades 6–8", g912:"Grades 9–12" };

/* Question format: [question, correct answer, [wrong answers], explanation] */
const UNITS = [
{ id:"rules", cat:"PE", icon:"🤝", name:"Rules, Safety & Sportsmanship", q:{
 k2:[
  ["What should you do when the teacher gives the freeze signal?","Stop and listen",["Keep running","Shout loudly"],"Freezing and listening keeps everyone safe and helps us hear what comes next."],
  ["What kind of shoes are best for P.E.?","Sneakers",["Flip-flops","Boots"],"Sneakers grip the floor and protect your feet when you run and jump."],
  ["A friend falls down during a game. What should you do?","Help them or get the teacher",["Laugh at them","Keep playing and ignore them"],"Good teammates look out for each other."],
  ["What is personal space?","The space around your body where you won't bump anyone",["Your friend's spot","The hallway"],"Staying in your own space keeps everyone from bumping and falling."],
  ["Your team lost the game. What should you say?","Good game!",["That's not fair!","I quit!"],"Good sports say 'good game' whether they win or lose."],
  ["When can you use the equipment?","When the teacher says it's time",["Whenever you want","Before class starts"],"Waiting for the signal keeps equipment and people safe."]],
 g35:[
  ["What does it mean to be a good sport?","Play fair and be respectful whether you win or lose",["Only play when you're winning","Argue with every call"],"Being a good sport means respecting the game, your teammates, and the other team."],
  ["In a game with no referee, like GaGa Ball at recess, who makes the calls?","The players, honestly",["Whoever yells the loudest","Nobody, just keep playing"],"When players referee themselves, honesty is what keeps the game fair and fun."],
  ["A teammate makes a mistake that costs a point. What's the best thing to say?","You'll get the next one!",["You made us lose!","Nothing, just roll your eyes"],"Encouragement helps your team bounce back faster than blame does."],
  ["Why do we warm up before activity?","To get muscles ready and help prevent injury",["To get tired before the game","There's no reason"],"Warm muscles stretch and move better, which lowers the chance of getting hurt."],
  ["You disagree with a close call in Four Square. What should you do?","Stay calm and use rock-paper-scissors or ask the teacher",["Stop playing and argue","Take the ball and leave"],"Settling it quickly and fairly keeps the game moving for everyone."],
  ["Why should you drink water during P.E.?","To replace the water you lose when you sweat",["To feel full","It makes you instantly faster"],"Staying hydrated helps your body stay cool and keeps your energy up."]],
 g68:[
  ["Which action shows respect for an opponent?","Shaking hands or saying 'good game' after the match",["Taunting after you score","Ignoring them at the end"],"Respecting opponents is part of the game, whether you win or lose."],
  ["What is the main purpose of a cool-down?","To gradually lower your heart rate and help your body recover",["To burn the most calories","To make muscles tighter"],"A cool-down lets your heart rate and breathing return to normal gradually."],
  ["A classmate is being left out of your group activity. What's the best move?","Invite them in and give them a role",["Let them figure it out","Tell the teacher they won't participate"],"Including everyone makes the group stronger and the activity better."],
  ["Why is it important to follow the rules of a game?","Rules keep play fair and safe for everyone",["Rules only matter in real sports","So the teacher isn't upset"],"Rules give everyone the same chance and protect players from injury."],
  ["What should you do before using a jump rope, scooter, or other equipment?","Check that it isn't damaged and that you have enough space",["Nothing, just start","Test it on a classmate"],"A quick safety check prevents a lot of avoidable injuries."],
  ["What is fair play?","Following rules, being honest, and respecting others",["Winning any way you can","Only playing against weaker teams"],"Fair play is about how you compete, not just whether you win."]],
 g912:[
  ["Which behavior best shows leadership in a team activity?","Including all teammates and helping plan strategy",["Taking every shot yourself","Criticizing weaker players"],"Strong leaders raise the level of everyone around them."],
  ["Why do organized sports use officials and rules?","To make competition fair and safe",["To slow the game down","To help one team win"],"Consistent rules and officials protect athletes and the integrity of the game."],
  ["You feel a sharp pain during exercise. What should you do?","Stop and tell the teacher or coach",["Push through it","Wait until class ends"],"Sharp pain is a warning sign. Stopping early can prevent a small injury from becoming a serious one."],
  ["Which is an example of intrinsic motivation?","Playing because you enjoy getting better",["Playing only to win a trophy","Playing because someone pays you"],"Intrinsic motivation comes from inside you, and it tends to keep people active for life."],
  ["Which are warning signs of heat exhaustion?","Heavy sweating, dizziness, and nausea",["Feeling full of energy","A bigger appetite"],"If you notice these signs, move to a cool place, drink water, and tell an adult."],
  ["A teammate is getting frustrated and starting to argue. What's most helpful?","Calmly help them refocus on the next play",["Argue back","Tell them to leave the game"],"Staying calm yourself is often the fastest way to calm a teammate down."]]
}},
{ id:"move", cat:"PE", icon:"🏃", name:"Movement Skills & Concepts", q:{
 k2:[
  ["Which movement uses just ONE foot?","Hop",["Jump","Gallop"],"A hop takes off and lands on the same foot."],
  ["What does a zigzag pathway look like?","A line that changes direction back and forth",["A straight line","A circle"],"Zigzag pathways go side to side, like a lightning bolt."],
  ["What is a HIGH level?","Reaching up tall",["Crawling on the floor","Sitting down"],"High level means your body is up tall, like stretching toward the ceiling."],
  ["A skip is a step and a...","Hop",["Slide","Jump"],"Skipping is step-hop, step-hop, switching feet each time."],
  ["Which pathway is curvy like a snake?","Curved",["Straight","Zigzag"],"A curved pathway bends smoothly without sharp corners."],
  ["When you gallop, what does your front foot do?","Stays in front the whole time",["Switches every step","Stays in the air"],"In a gallop, the same foot leads and the back foot chases it."]],
 g35:[
  ["What's the difference between a hop and a jump?","A hop uses one foot; a jump uses two feet",["They're exactly the same","A jump uses one foot"],"Hops take off and land on the same foot. Jumps usually take off and land on two feet."],
  ["Which locomotor skill moves you sideways?","Slide",["Skip","Leap"],"In a slide, you step to the side and bring your feet together, facing forward."],
  ["How is a leap different from a run?","You push off one foot and land on the other with a longer, higher step",["Both feet land together","You move backward"],"A leap is like a giant running step that stretches through the air."],
  ["What is general space?","All the open space everyone shares in the gym",["The space right around your body","Only the space inside your hoop"],"General space is shared, so you have to watch where others are moving."],
  ["What does moving at a LOW level mean?","Moving close to the ground",["Moving slowly","Moving quietly"],"Low level means crouching or crawling near the floor."],
  ["Which of these is a non-locomotor movement?","Twisting in place",["Running","Galloping"],"Non-locomotor movements happen without traveling, like bending, twisting, and stretching."]],
 g68:[
  ["Which movement concept describes how fast you move?","Speed (time)",["Pathway","Level"],"Speed is about timing: fast, slow, speeding up, or slowing down."],
  ["In movement, what does force describe?","How strong or light a movement is",["Which direction you face","How high you are"],"Force ranges from strong, like a hard throw, to light, like a soft toss."],
  ["Changing direction quickly to avoid a defender uses which skill?","Agility",["Flexibility","Muscular endurance"],"Agility is the ability to change direction quickly while staying in control."],
  ["How should you land from a jump?","Bend your knees to absorb the force",["Keep your knees straight and locked","Land on your heels only"],"Bent knees spread the impact out and protect your joints."],
  ["What do relationships in movement describe?","How you move in relation to people or objects, like over, under, or around",["How well you get along with friends","Your grade in P.E."],"Relationships include over, under, around, beside, leading, and following."],
  ["Which is part of a mature running pattern?","Arms swing opposite to the legs",["Arms stay stiff at your sides","Running flat-footed"],"Opposite arm and leg movement helps you balance and run more efficiently."]],
 g912:[
  ["What does opposition mean in movement?","Moving the arm opposite the leading leg",["Moving against a defender","Moving backward"],"Opposition balances rotation in the body during running, throwing, and walking."],
  ["Why does bending your knees when landing reduce impact?","It spreads the force over a longer time",["It makes you lighter","It speeds up the landing"],"Increasing the time it takes to stop lowers the peak force on your joints."],
  ["How can you lower your center of gravity?","Bend your knees and widen your stance",["Stand tall on your toes","Raise your arms overhead"],"A lower center of gravity makes you harder to knock off balance."],
  ["Which stance gives the most stable base of support?","Feet shoulder-width apart, knees bent",["Feet together, standing tall","Standing on one foot"],"A wider base and lower center of gravity increase stability."],
  ["What does follow-through in a throw or kick help with?","Accuracy, power, and lower injury risk",["It only looks good","It slows the ball down"],"Follow-through keeps force moving toward the target and lets your body slow down safely."],
  ["Why do sprinters lean forward at the start?","To move their center of gravity ahead and accelerate",["To see the finish line","To rest their legs"],"Leaning forward lets sprinters push back into the ground and speed up faster."]]
}},
{ id:"fitness", cat:"PE", icon:"💪", name:"Fitness Components", q:{
 k2:[
  ["Which activity makes your heart pump fast?","Running",["Sleeping","Reading"],"Moving your whole body gets your heart pumping and makes it stronger."],
  ["Stretching helps your body be more...","Flexible (bendy)",["Tired","Hungry"],"Stretching helps your muscles move and bend more easily."],
  ["Which activity makes your muscles stronger?","Climbing the monkey bars",["Watching TV","Napping"],"Pulling, pushing, and climbing all build muscle strength."],
  ["Your heart is a...","Muscle",["Bone","Balloon"],"Your heart is a muscle that gets stronger when you exercise."],
  ["How can you tell your heart is working hard?","You can feel it beating faster",["Your hair gets longer","You feel sleepy"],"Put your hand on your chest after running to feel your heart pumping."],
  ["About how long should kids be active every day?","60 minutes",["5 minutes","10 hours"],"Kids need about an hour of active play every day to stay healthy."]],
 g35:[
  ["Cardiovascular endurance is the ability of your...","Heart and lungs to work for a long time",["Muscles to lift heavy things","Body to bend"],"Activities like running, swimming, and tag build cardiovascular endurance."],
  ["Holding a wall sit for a long time tests your...","Muscular endurance",["Flexibility","Speed"],"Muscular endurance is how long your muscles can keep working without getting too tired."],
  ["Which activity best builds flexibility?","Yoga",["Sprinting","Arm wrestling"],"Yoga poses and stretches help your muscles and joints move through a bigger range."],
  ["What does your pulse tell you?","How fast your heart is beating",["How tall you are","How strong you are"],"You can count your pulse at your wrist or neck."],
  ["The PACER test measures...","Cardiovascular endurance",["Flexibility","Muscle strength"],"The PACER checks how long your heart and lungs can keep up with the beeps."],
  ["Tug of war mainly builds...","Muscular strength",["Flexibility","Balance only"],"Pulling hard against resistance builds muscle strength."]],
 g68:[
  ["Which is NOT one of the five health-related fitness components?","Speed",["Flexibility","Body composition"],"The five are cardiovascular endurance, muscular strength, muscular endurance, flexibility, and body composition. Speed is skill-related."],
  ["In the FITT principle, what does the F stand for?","Frequency",["Fitness","Force"],"FITT stands for Frequency, Intensity, Time, and Type."],
  ["The sit-and-reach test measures...","Flexibility",["Muscle strength","Heart health"],"It measures how far you can reach, mostly testing hamstring and lower-back flexibility."],
  ["Which is a skill-related fitness component?","Reaction time",["Muscular endurance","Flexibility"],"Skill-related components are agility, balance, coordination, power, reaction time, and speed."],
  ["What does the overload principle mean?","Gradually doing more than your body is used to so it gets stronger",["Exercising until you're exhausted every day","Lifting as heavy as possible right away"],"Small, steady increases in challenge are how fitness improves safely."],
  ["How much physical activity do kids and teens ages 6–17 need each day?","At least 60 minutes",["10 minutes","3 hours"],"Most of those 60 minutes should be moderate to vigorous activity."]],
 g912:[
  ["Using 220 minus age, what's the estimated maximum heart rate for a 16-year-old?","204 beats per minute",["184 beats per minute","236 beats per minute"],"220 − 16 = 204. It's an estimate, but it's useful for planning exercise intensity."],
  ["During vigorous activity, the talk test says you can...","Say only a few words before pausing for breath",["Sing easily","Hold a full conversation"],"At moderate intensity you can talk but not sing. At vigorous intensity, only a few words."],
  ["What does body composition refer to?","The proportion of fat mass to lean mass",["Your height","Your weight alone"],"Body composition looks at what your body is made of, not just the number on a scale."],
  ["Adults should get at least how much moderate aerobic activity per week?","150 minutes",["30 minutes","500 minutes"],"That's about 30 minutes a day, five days a week."],
  ["Plyometric exercises like box jumps mainly develop...","Power",["Flexibility","Body composition"],"Power combines strength and speed in explosive movements."],
  ["Which principle says fitness gains fade when you stop training?","Reversibility",["Overload","Specificity"],"Use it or lose it: fitness declines when training stops."]]
}},
{ id:"coop", cat:"PE", icon:"🧩", name:"Cooperation & Teamwork", q:{
 k2:[
  ["How can you be a good partner?","Take turns and share",["Grab everything first","Do it only your way"],"Taking turns makes the game fair and fun for both of you."],
  ["Your partner has a different idea. What should you do?","Listen to their idea",["Say no right away","Walk away"],"Listening to each other helps you find the best plan together."],
  ["What can you say to cheer on a teammate?","Nice try! You can do it!",["You're too slow","Go away"],"Kind words help your team keep trying."],
  ["What does working together mean?","Everyone helps the group reach the goal",["One person does all the work","Everyone does their own thing"],"Teams are strongest when everyone helps."],
  ["What should you do while you wait for your turn?","Wait patiently and cheer for others",["Push to the front","Wander away"],"Cheering while you wait helps your whole team."],
  ["Your team's tower falls down. What's the best thing to do?","Try again together",["Blame someone","Quit"],"Mistakes happen. Good teams try again."]],
 g35:[
  ["What makes a team plan work best?","Everyone shares ideas and agrees on a plan",["The loudest person decides","No plan at all"],"When everyone has a voice, the team is more likely to follow the plan."],
  ["During a silent challenge, how can teammates communicate?","Hand signals and eye contact",["They can't communicate","By shouting"],"Communication isn't only words. Gestures and signals work too."],
  ["A teammate is struggling with the task. What should you do?","Offer help or a tip",["Laugh","Do it for them without asking"],"Helping a teammate helps the whole team succeed."],
  ["What is the goal of a cooperative challenge?","Succeed together as a group",["Beat your own teammates","Finish first alone"],"In cooperative games, the team wins or learns together."],
  ["Which is an example of active listening?","Looking at the speaker and not interrupting",["Talking over them","Looking away"],"Active listening shows your teammate their idea matters."],
  ["Why do teams talk about what worked after a challenge?","To improve their plan next time",["To pick someone to blame","It wastes time"],"Reflecting is how teams get better from round to round."]],
 g68:[
  ["What's the first step in solving a group problem?","Make sure everyone understands the goal",["Start moving right away","Pick a winner"],"A team that agrees on the goal wastes less time."],
  ["What does a good team leader do?","Makes sure every voice is heard",["Makes every decision alone","Only talks to their friends"],"Good leaders use everyone's strengths."],
  ["What does compromise mean?","Each side gives a little to reach an agreement",["One side always gets its way","Nobody agrees"],"Compromise keeps a team moving forward."],
  ["Which is an example of constructive feedback?","'Try stepping toward the target. It worked for me.'",["'You're terrible at this.'","'Whatever, just do it.'"],"Constructive feedback is specific and helpful."],
  ["Why is trust important in teamwork challenges?","Teammates rely on each other to do their part safely",["It isn't important","So you can blame others"],"Trust lets a team take on harder challenges together."],
  ["How do group roles like planner, encourager, or timekeeper help?","Everyone has a clear job and contributes",["They make things confusing","Only the planner matters"],"Roles make sure no one is left out and nothing is forgotten."]],
 g912:[
  ["What is the first stage of team development (Tuckman)?","Forming",["Performing","Adjourning"],"The stages are forming, storming, norming, performing, and adjourning."],
  ["What happens in the storming stage?","Members disagree as roles and ideas get sorted out",["The team works perfectly","The team breaks up"],"Conflict in the storming stage is normal and can lead to a stronger team."],
  ["How is conflict on a team best handled?","Address it calmly and focus on solutions",["Ignore it","Pick sides"],"Solution-focused conversations keep teams productive."],
  ["Which shows inclusive leadership?","Adapting a strategy so every skill level can contribute",["Only passing to the best players","Benching newer players"],"Inclusive teams get more out of every member."],
  ["What is social loafing?","Putting in less effort because you're in a group",["Resting between sets","Being friendly"],"Clear roles and accountability help prevent social loafing."],
  ["Which is effective communication during a game?","Short, clear calls like 'Mine!' or 'Switch!'",["Long explanations mid-play","Staying silent"],"Quick, clear calls prevent collisions and confusion."]]
}},
{ id:"throw", cat:"PE", icon:"⚾", name:"Throwing, Catching & Kicking", q:{
 k2:[
  ["When you throw underhand, which foot steps forward?","The foot opposite your throwing hand",["The same foot as your throwing hand","Neither foot"],"Stepping with the opposite foot gives your throw more power and balance."],
  ["Before you throw, where should your eyes look?","At your target",["At your feet","At the ceiling"],"Looking at the target helps the ball go where you want it."],
  ["How should your hands look when you get ready to catch?","Out in front and open",["Behind your back","In your pockets"],"Ready hands are out in front, open, and watching the ball."],
  ["After you throw, what should your arm do?","Follow through toward the target",["Stop right away","Swing behind you"],"Following through points your arm right where you want the ball to go."],
  ["When you roll a ball, what should you do?","Bend your knees and keep the ball low",["Throw it high","Kick it"],"A low, smooth roll stays on the ground and goes straight."],
  ["Which part of your foot is best for passing a soccer ball?","The inside of your foot",["Your heel","The tip of your toes"],"The inside of your foot is flat and wide, so passes go straight."]],
 g35:[
  ["How should you stand when starting an overhand throw?","Side facing the target",["Back to the target","Facing away"],"Starting sideways lets your body turn and add power to the throw."],
  ["To catch a ball above your waist, point your...","Thumbs together",["Pinkies together","Elbows out"],"Thumbs together above the waist, pinkies together below the waist."],
  ["When kicking, where should your plant foot go?","Next to the ball",["Far behind the ball","On top of the ball"],"Planting next to the ball gives you balance and control."],
  ["How do you catch a ball softly?","Pull your hands in toward your body as it arrives",["Keep your arms stiff","Clap at the ball"],"Giving with the ball absorbs its force so it doesn't bounce out."],
  ["When dribbling a basketball, what should you use?","Your finger pads, not your palm",["Your fist","Your palm only"],"Finger pads give you more control of the ball."],
  ["Why step with the opposite foot when throwing?","To throw farther and more accurately",["It looks cool","To stop yourself"],"The step helps your whole body put force into the throw."]],
 g68:[
  ["In a mature overhand throw, what do the hips and shoulders do?","Rotate toward the target",["Stay still","Turn away from the target"],"Rotation adds power by using the whole body, not just the arm."],
  ["Which is the correct order for an overhand throw?","Side to target, arm back, step, rotate, follow through",["Step, follow through, arm back","Follow through, rotate, step"],"Each part builds on the one before it."],
  ["How do you trap (stop) a soccer ball?","Cushion it by giving with your foot",["Stomp on it hard","Kick it back right away"],"Giving with the ball takes away its speed so it stays close."],
  ["A bounce pass should hit the floor about how far toward your teammate?","About two-thirds of the way",["Right at your feet","Right at their feet"],"Two-thirds of the way lets the ball bounce up to your teammate's waist."],
  ["What does leading a teammate mean?","Throwing to the space where they will be",["Throwing where they are standing now","Throwing it to yourself"],"Leading a moving teammate lets them catch without slowing down."],
  ["Why keep your eyes up while dribbling?","To see teammates, defenders, and open space",["To look cool","It doesn't matter"],"Heads-up dribbling helps you make better decisions."]],
 g912:[
  ["Where does most of a throw's power come from?","Rotation from the legs to the hips, trunk, and arm (the kinetic chain)",["The wrist alone","The fingers"],"Power builds as each body segment passes force to the next."],
  ["Why does follow-through reduce injury risk?","It lets the arm slow down gradually",["It makes the throw shorter","It doesn't reduce risk"],"Stopping the arm abruptly puts extra stress on the shoulder and elbow."],
  ["What does a soft first touch when receiving a pass mean?","Absorbing the ball's force by moving with it",["Hitting the ball away","Letting it bounce off you"],"A soft touch keeps the ball close so you can play quickly."],
  ["When shooting a basketball, where should your elbow be?","Under the ball, lined up with the hoop",["Pointing out to the side","Behind your head"],"An aligned elbow keeps the shot straight."],
  ["What does BEEF stand for in shooting?","Balance, Eyes, Elbow, Follow-through",["Bounce, Elbow, Energy, Fake","Ball, Eyes, Effort, Finish"],"BEEF is a common checklist for shooting form."],
  ["How do you drive a soccer ball low and hard?","Strike it with your laces, toe pointed down, knee over the ball",["Use the inside of your foot","Kick it with your toe"],"Laces with the knee over the ball keeps the shot powerful and low."]]
}},
{ id:"sports", cat:"PE", icon:"🏆", name:"Sports & Game Strategy", q:{
 k2:[
  ["How can you avoid being tagged in tag?","Dodge and change direction",["Stand still","Close your eyes"],"Quick changes of direction make you hard to tag."],
  ["When moving in a busy game, where should your eyes be?","Up, watching where you're going",["On your shoes","Closed"],"Heads up helps you avoid bumping into others."],
  ["In a relay, when do you go?","When your teammate tags you",["Whenever you want","Before the teacher says go"],"Waiting for the tag keeps the relay fair."],
  ["Which game uses a big pit and a soft ball?","GaGa Ball",["Soccer","Bowling"],"GaGa Ball is played in a pit, hitting the ball low."],
  ["In which sport do you kick a ball into a goal?","Soccer",["Basketball","Baseball"],"In soccer, you use your feet to score goals."],
  ["Which sport uses a bat?","Baseball or softball",["Soccer","Swimming"],"You swing a bat to hit the ball in baseball and softball."]],
 g35:[
  ["In Four Square, how many times can the ball bounce in your square?","Once",["Twice","Never"],"One bounce, then hit it to another square."],
  ["In GaGa Ball, you're out if the ball hits you...","On or below the knee",["Anywhere","Only on the head"],"Keeping hits low is what keeps GaGa Ball safe."],
  ["Which of these is an invasion game?","Soccer",["Bowling","Volleyball"],"In invasion games, you move into the other team's space to score."],
  ["On offense, why move to an open space?","To get open for a pass",["To hide","To rest"],"Open space gives your teammate a safe place to pass."],
  ["In a net game like volleyball, what's the goal?","Send the ball over so the other team can't return it",["Hold the ball","Hit it into the net"],"Net games are about placing the ball where opponents aren't."],
  ["In Four Square, who serves the ball?","The player in the highest square",["Anyone","The player who just got out"],"The top square serves to start each point."]],
 g68:[
  ["Which category does tennis belong to?","Net/wall games",["Invasion games","Target games"],"Net/wall games include tennis, volleyball, badminton, and pickleball."],
  ["Which are striking and fielding games?","Softball and kickball",["Soccer and hockey","Golf and bowling"],"Striking and fielding teams take turns batting and fielding."],
  ["On defense in basketball, where should you stay?","Between your opponent and the basket",["Behind your opponent","Under the basket only"],"Staying between them and the goal protects the basket."],
  ["What does creating width on offense mean?","Spreading out across the field to open space",["Everyone crowding the ball","Standing in a line"],"Spreading out stretches the defense and opens passing lanes."],
  ["Which is a target game?","Golf",["Hockey","Badminton"],"Target games include golf, bowling, archery, and cornhole."],
  ["Why do teams use a zone defense?","Each player guards an area instead of one person",["To rest","It's required"],"Zones protect space and can slow down strong offenses."]],
 g912:[
  ["What does transition mean in invasion games?","Switching quickly between offense and defense",["Changing uniforms","Substituting players"],"Fast transitions often create scoring chances."],
  ["What does the offside rule in soccer prevent?","Attackers waiting behind the last defender for a pass",["Passing backward","Goalkeepers using hands"],"Offside keeps attackers from camping near the goal."],
  ["In volleyball, how many contacts can a team use before sending the ball over?","Three",["One","Five"],"Typically bump, set, and spike."],
  ["What is a give-and-go?","Passing to a teammate, cutting, and getting the ball back",["A penalty","A type of serve"],"The give-and-go uses quick movement to beat a defender."],
  ["What does man-to-man defense mean?","Each defender guards a specific opponent",["Everyone guards the ball","Defenders guard areas"],"Man-to-man puts direct pressure on each attacker."],
  ["What are lifetime sports?","Activities you can keep playing as an adult, like tennis or golf",["Sports you only play in school","Sports with lifetime bans"],"Lifetime sports help people stay active for decades."]]
}},
{ id:"nutrition", cat:"Health", icon:"🍎", name:"Nutrition", q:{
 k2:[
  ["Which food is a fruit?","Apple",["Carrot","Bread"],"Apples, bananas, and berries are all fruits."],
  ["What's the best drink when you're thirsty?","Water",["Soda","A milkshake"],"Water keeps your body working its best."],
  ["How many food groups are on MyPlate?","Five",["Two","Ten"],"Fruits, vegetables, grains, protein, and dairy."],
  ["Which food is a vegetable?","Broccoli",["Banana","Cheese"],"Broccoli, carrots, and peas are vegetables."],
  ["Which food helps build strong bones?","Milk or yogurt",["Candy","Chips"],"Dairy foods have calcium, which builds strong bones."],
  ["Why do we eat breakfast?","To give our body energy for the day",["To get sleepy","To skip lunch"],"Breakfast fuels your brain and body for learning and playing."]],
 g35:[
  ["Which food group do beans, eggs, and chicken belong to?","Protein",["Grains","Fruits"],"Protein foods help build and repair your body."],
  ["About how much of MyPlate should be fruits and vegetables?","About half",["None","All of it"],"Filling half your plate with fruits and veggies is a simple healthy habit."],
  ["What do whole grains like brown rice give you?","Fiber and long-lasting energy",["Only sugar","Nothing"],"Whole grains keep you full and energized longer."],
  ["Which snack is the healthiest choice?","Apple slices with peanut butter",["A candy bar","A soda"],"Fruit plus protein gives you steady energy."],
  ["Which nutrient helps build and repair muscles?","Protein",["Sugar","Salt"],"Protein is your body's building material."],
  ["Why should you limit sugary drinks?","They have lots of added sugar and few nutrients",["They're too cold","They have too much water"],"Water and milk are better everyday choices."]],
 g68:[
  ["What is the main job of carbohydrates?","Provide energy",["Build bones","Fight germs"],"Carbohydrates are your body's main fuel source."],
  ["Which food has healthy unsaturated fats?","Avocado or nuts",["Butter","Fried chicken skin"],"Unsaturated fats support heart health."],
  ["On a Nutrition Facts label, what does 20% Daily Value or more mean?","The food is high in that nutrient",["The food is low in that nutrient","It has 20 calories"],"5% or less is low; 20% or more is high."],
  ["Which mineral is important for strong bones?","Calcium",["Sodium","Sugar"],"Calcium comes from dairy, leafy greens, and fortified foods."],
  ["What does the serving size on a label tell you?","The amount all the nutrition info is based on",["How many people can eat it","The size of the box"],"If you eat two servings, you double everything on the label."],
  ["What can dehydration cause?","Headaches, tiredness, and muscle cramps",["Extra energy","Better focus"],"Drink water before, during, and after activity."]],
 g912:[
  ["How many calories are in 1 gram of fat?","9",["4","7"],"Fat has 9 calories per gram; carbohydrates and protein have 4."],
  ["How many calories per gram do carbohydrates and protein provide?","4",["9","2"],"Both carbohydrates and protein provide 4 calories per gram."],
  ["The Dietary Guidelines say added sugars should be less than what share of daily calories?","10%",["50%","25%"],"Keeping added sugars under 10% leaves room for nutrient-rich foods."],
  ["What can iron deficiency cause?","Anemia, with tiredness and weakness",["Stronger bones","Better vision"],"Iron helps red blood cells carry oxygen."],
  ["Which is a warning sign of a fad diet?","It cuts out entire food groups for quick results",["It includes all food groups","It's recommended by a doctor"],"Balanced eating over time works better than extreme rules."],
  ["What's a good recovery meal after intense exercise?","Carbohydrates and protein",["Nothing at all","Only soda"],"Carbs refuel energy stores and protein helps repair muscles."]]
}},
{ id:"body", cat:"Health", icon:"❤️", name:"Body Systems & Heart Health", q:{
 k2:[
  ["What does your heart do?","Pumps blood around your body",["Helps you see","Digests food"],"Your heart pumps blood all day and all night."],
  ["Which body part helps you breathe?","Lungs",["Stomach","Knees"],"Your lungs fill with air every time you breathe in."],
  ["What do your bones do?","Help your body stand up and keep its shape",["Pump blood","Help you taste"],"Your skeleton holds you up and protects your insides."],
  ["Where is your brain?","In your head",["In your tummy","In your foot"],"Your brain is protected by your skull."],
  ["What happens to your breathing when you run?","It gets faster",["It stops","It gets slower"],"Your body needs more air when you move fast."],
  ["What do muscles help you do?","Move your body",["Sleep","Grow hair"],"Muscles pull on bones to help you move."]],
 g35:[
  ["What do your lungs bring into your body?","Oxygen",["Food","Water"],"Oxygen goes from your lungs into your blood."],
  ["Which system includes your heart and blood vessels?","Circulatory system",["Digestive system","Skeletal system"],"The circulatory system moves blood through your body."],
  ["About how many bones does an adult have?","206",["50","1,000"],"Babies are born with more, but some bones fuse together as they grow."],
  ["Where can you easily feel your pulse?","Your wrist or neck",["Your elbow","Your knee"],"Use two fingers, not your thumb, to count your pulse."],
  ["Which two systems work together to help you move?","Muscular and skeletal systems",["Digestive and nervous","Circulatory and digestive"],"Muscles pull on bones to create movement."],
  ["Why does your heart beat faster during exercise?","Your muscles need more oxygen",["It's scared","It's tired"],"A faster heartbeat delivers more oxygen-rich blood to working muscles."]],
 g68:[
  ["How many chambers does the human heart have?","Four",["Two","Six"],"Two atria on top and two ventricles on the bottom."],
  ["Which way do arteries carry blood?","Away from the heart",["Toward the heart","Only to the lungs"],"Arteries carry blood away; veins bring it back."],
  ["Where does gas exchange happen in the lungs?","Alveoli",["Trachea","Diaphragm"],"Alveoli are tiny air sacs where oxygen enters the blood."],
  ["Which muscle helps you breathe?","Diaphragm",["Biceps","Quadriceps"],"The diaphragm pulls down to let air rush into your lungs."],
  ["What do tendons connect?","Muscles to bones",["Bones to bones","Nerves to skin"],"Tendons let muscles pull on bones."],
  ["How does regular exercise change the heart?","It gets stronger and pumps more blood with each beat",["It gets weaker","It stops growing"],"A stronger heart doesn't have to beat as often at rest."]],
 g912:[
  ["What is a normal resting heart rate for most adults?","60–100 beats per minute",["20–40 beats per minute","150–200 beats per minute"],"Well-trained athletes are often below 60."],
  ["In a blood pressure reading, what does the systolic (top) number measure?","Pressure when the heart beats",["Pressure between beats","Heart rate"],"The bottom number, diastolic, is the pressure between beats."],
  ["Which blood vessels have walls thin enough for exchange with tissues?","Capillaries",["Arteries","Veins"],"Capillaries deliver oxygen and nutrients to cells."],
  ["What do ligaments connect?","Bone to bone",["Muscle to bone","Skin to muscle"],"Ligaments stabilize joints."],
  ["What does a low resting heart rate in an athlete usually mean?","A more efficient, well-trained heart",["A heart problem every time","Dehydration"],"A trained heart pumps more blood with each beat, so it beats less often."],
  ["What is atherosclerosis?","A buildup of plaque in the arteries",["A broken bone","A lung infection"],"Regular activity and healthy eating help lower the risk."]]
}},
{ id:"hygiene", cat:"Health", icon:"🧼", name:"Hygiene & Disease Prevention", q:{
 k2:[
  ["How long should you wash your hands?","20 seconds",["2 seconds","5 minutes"],"That's about how long it takes to sing Happy Birthday twice."],
  ["When should you wash your hands?","After the bathroom and before eating",["Only on weekends","Never"],"Clean hands help stop germs."],
  ["How should you cover a sneeze?","Into your elbow",["Into your hands","Don't cover it"],"Your elbow catches germs so they don't spread from your hands."],
  ["How many times a day should you brush your teeth?","Two",["Zero","Ten"],"Brush in the morning and before bed."],
  ["What can germs do?","Make you sick",["Make you taller","Make you faster"],"Washing hands and covering sneezes helps keep germs away."],
  ["Why do we need sleep?","To help our body grow and rest",["To get hungry","It isn't needed"],"Sleep helps your body and brain recharge."]],
 g35:[
  ["How long should you brush your teeth each time?","Two minutes",["10 seconds","10 minutes"],"Two minutes, twice a day, keeps teeth healthy."],
  ["What do white blood cells do?","Fight germs",["Carry oxygen","Help you digest food"],"White blood cells are part of your immune system."],
  ["What's one of the best ways to stop germs from spreading?","Wash hands with soap and water",["Share water bottles","Sneeze into your hands"],"Handwashing removes germs before they spread."],
  ["How much sleep do kids ages 6–12 need each night?","9–12 hours",["4–5 hours","15–18 hours"],"Enough sleep helps you learn, grow, and stay healthy."],
  ["Why shouldn't you share water bottles?","Germs can spread through saliva",["The water gets warm","It's against the rules for no reason"],"Keeping your own bottle is an easy way to stay healthy."],
  ["What does your immune system do?","Protects your body from germs",["Helps you run fast","Makes your hair grow"],"Your immune system recognizes and fights off invaders."]],
 g68:[
  ["Bacteria and viruses are both types of...","Pathogens",["Vitamins","Nutrients"],"Pathogens are germs that can cause disease."],
  ["What do antibiotics work against?","Bacteria, not viruses",["Viruses, not bacteria","Every illness"],"Antibiotics don't work on colds or the flu, which are caused by viruses."],
  ["How do vaccines help?","They train your immune system to recognize a germ",["They cure every disease","They replace sleep"],"Vaccines help your body respond faster if you're exposed."],
  ["How much sleep do teens ages 13–18 need?","8–10 hours",["5–6 hours","12–14 hours"],"Teens need more sleep than many realize."],
  ["How can you prevent athlete's foot?","Keep feet clean and dry and wear shower shoes",["Share towels","Wear damp socks"],"The fungus grows in warm, damp places."],
  ["Sweat glands get more active during puberty. What's a good habit?","Shower daily and use deodorant",["Shower once a month","Skip clean clothes"],"Daily hygiene helps you feel confident and healthy."]],
 g912:[
  ["What is a communicable disease?","One that can spread from person to person",["One you're born with","One caused only by diet"],"The flu and strep throat are communicable."],
  ["What is herd (community) immunity?","When enough people are immune that a disease has trouble spreading",["When animals get sick","Immunity from one cold"],"It helps protect people who can't be vaccinated."],
  ["Which is a noncommunicable disease?","Type 2 diabetes",["The flu","Strep throat"],"Noncommunicable diseases aren't spread by germs."],
  ["Which helps prevent foodborne illness?","Cooking foods to safe temperatures and washing hands",["Leaving food out overnight","Rinsing raw chicken in the sink"],"Clean, separate, cook, and chill are the four key steps."],
  ["What makes antibiotic resistance worse?","Using antibiotics when they aren't needed or not finishing them",["Washing hands","Getting enough sleep"],"Using antibiotics correctly helps them keep working."],
  ["Which habit most reduces skin cancer risk?","Using SPF 30+ sunscreen and limiting UV exposure",["Tanning beds","Only using sunscreen in summer"],"Sun protection matters year-round."]]
}},
{ id:"mental", cat:"Health", icon:"🧠", name:"Mental & Emotional Health", q:{
 k2:[
  ["When you feel angry, what can help you calm down?","Take slow, deep breaths",["Yell at a friend","Throw something"],"Deep breaths slow your body down and help you think."],
  ["If you feel sad, who can you talk to?","A trusted adult, like a parent or teacher",["No one","A stranger"],"Talking about feelings helps."],
  ["Which face shows happy?","😀",["😢","😠"],"A smile usually means happy. All feelings are okay to have."],
  ["Which feelings are okay to have?","All kinds of feelings",["Only happy ones","None"],"Everyone feels happy, sad, mad, and scared sometimes."],
  ["What's a kind thing to say to a friend?","Want to play with me?",["Go away","You can't play"],"Kind words make people feel included."],
  ["When you make a mistake, what can you say?","I'll try again!",["I'm bad at everything","I give up"],"Mistakes help us learn."]],
 g35:[
  ["Which is a healthy way to handle stress?","Exercise, deep breathing, or talking to someone",["Keeping it all inside","Being mean to others"],"Healthy coping helps your body and mind."],
  ["What does growth mindset mean?","Believing you can get better with practice and effort",["You're either good or bad at things","Never trying new things"],"Your brain grows when you practice something hard."],
  ["Someone is being bullied. What should you do?","Tell a trusted adult and be kind to the person",["Join in","Ignore it"],"Speaking up can make a big difference."],
  ["What is empathy?","Understanding how someone else feels",["Only caring about yourself","Being really good at sports"],"Empathy helps us be better friends and teammates."],
  ["How does exercise affect your mood?","It can make you feel happier and calmer",["It always makes you grumpy","It has no effect"],"Physical activity releases chemicals that boost your mood."],
  ["Which is an example of positive self-talk?","'I can do hard things.'",["'I'm never good at anything.'","'Why even try?'"],"How you talk to yourself matters."]],
 g68:[
  ["What is an emotional trigger?","Something that causes a strong emotional reaction",["A part of a gun","A type of exercise"],"Knowing your triggers helps you plan how to respond."],
  ["Which could be a sign someone needs help with their mental health?","Pulling away from friends and activities they used to enjoy",["Laughing at a joke","Trying a new sport"],"If you notice this in yourself or a friend, talk to a trusted adult."],
  ["How should you handle cyberbullying?","Don't respond, save evidence, and tell a trusted adult",["Post something mean back","Keep it a secret"],"Adults can help stop it."],
  ["What do healthy friendships include?","Respect, trust, and support",["Pressure and control","Keeping secrets that hurt you"],"Good friends make you feel safe and valued."],
  ["Which coping strategy is healthy?","Journaling or going for a walk",["Bottling feelings up","Lashing out at others"],"Healthy coping helps you process feelings."],
  ["Regular physical activity can help reduce...","Stress and anxiety",["Happiness","Sleep quality"],"Movement is one of the best tools for managing stress."]],
 g912:[
  ["In the U.S., what number can you call or text if you or a friend is in crisis?","988",["411","311"],"988 reaches the Suicide & Crisis Lifeline any time, day or night. You can also tell a trusted adult."],
  ["What is resilience?","The ability to bounce back from challenges",["Never feeling stressed","Avoiding problems"],"Resilience can be built with practice and support."],
  ["How can chronic stress affect the body?","It can weaken the immune system and disrupt sleep",["It makes you stronger every time","It has no effect"],"Managing stress protects both mental and physical health."],
  ["Which is an example of an I-message?","'I feel frustrated when plans change last minute.'",["'You always ruin everything.'","'You never listen.'"],"I-messages express feelings without blaming."],
  ["Which is a warning sign of an unhealthy relationship?","Someone controlling who you talk to or checking your phone",["Respecting your boundaries","Supporting your goals"],"Healthy relationships respect independence."],
  ["What is mindfulness?","Paying attention to the present moment without judgment",["Thinking about the future constantly","Ignoring feelings"],"Mindfulness can lower stress and improve focus."]]
}},
{ id:"safety", cat:"Health", icon:"⛑️", name:"Safety & First Aid", q:{
 k2:[
  ["What number do you call in an emergency?","911",["123","411"],"Call 911 when someone is badly hurt or in danger."],
  ["What should you do before crossing the street?","Look left, right, and left again",["Run across fast","Close your eyes"],"Always cross with an adult and look both ways."],
  ["What should you wear when you ride a bike?","A helmet",["Sandals","A hat"],"Helmets protect your brain."],
  ["If your clothes catch on fire, what do you do?","Stop, drop, and roll",["Run","Hide"],"Rolling puts out the flames."],
  ["During a fire drill, what do you do?","Walk quietly to the exit with your class",["Run and scream","Hide under a desk"],"Staying calm and quiet helps everyone hear directions."],
  ["You find pills or medicine. What should you do?","Don't touch it and tell an adult",["Taste it","Give it to a friend"],"Medicine can be dangerous if it isn't meant for you."]],
 g35:[
  ["What should you do first with a small cut?","Clean it with soap and water",["Ignore it","Rub dirt on it"],"Cleaning helps prevent infection."],
  ["What should you do for a bloody nose?","Lean forward and pinch the soft part of your nose",["Tilt your head back","Lie down flat"],"Leaning forward keeps blood from going down your throat."],
  ["For a sprain, what does RICE stand for?","Rest, Ice, Compression, Elevation",["Run, Ice, Clean, Exercise","Rest, Itch, Cover, Eat"],"RICE helps reduce swelling and pain."],
  ["A stranger online asks for your address. What should you do?","Don't share it and tell a trusted adult",["Share it","Send a photo of your house"],"Never share personal information online."],
  ["Why wear a seatbelt?","It keeps you in place and protects you in a crash",["It's comfy","It's only for adults"],"Seatbelts save lives."],
  ["Where should kids under 13 sit in a car?","In the back seat",["In the front seat","Standing up"],"The back seat is the safest place for kids."]],
 g68:[
  ["What should you do for a minor burn?","Cool it under running water",["Put ice directly on it","Cover it with butter"],"Cool running water for several minutes helps stop the burn."],
  ["How do you stop bleeding from a cut?","Apply firm, direct pressure with a clean cloth",["Blow on it","Leave it uncovered"],"Direct pressure is the first step."],
  ["What is the universal sign for choking?","Hands clutched at the throat",["Waving both arms","Thumbs up"],"If someone can't speak or cough, get help right away."],
  ["What should you do before helping an injured person?","Check that the scene is safe",["Move them right away","Take a picture"],"You can't help if you get hurt too."],
  ["Which can be signs of a concussion?","Headache, dizziness, and confusion after a hit to the head",["Feeling hungry","A runny nose"],"Concussions are brain injuries and need an adult's attention."],
  ["What should you do after a hit to the head in sports?","Stop playing and tell a coach or adult",["Keep playing","Hide it"],"Returning too soon can make a concussion worse."]],
 g912:[
  ["At what rate should hands-only CPR compressions be given?","100–120 per minute",["30 per minute","200 per minute"],"That's about the beat of 'Stayin' Alive.'"],
  ["About how deep should chest compressions be for an adult?","At least 2 inches",["Half an inch","6 inches"],"Push hard and fast in the center of the chest."],
  ["What is an AED used for?","Delivering a shock to restore a normal heart rhythm",["Measuring blood pressure","Treating burns"],"AEDs give spoken directions anyone can follow."],
  ["Which can be signs of a heart attack?","Chest pain or pressure and shortness of breath",["A sore throat","An itchy arm"],"Call 911 right away."],
  ["Which are signs of heat stroke?","Very high body temperature and confusion",["Feeling a little warm","Mild thirst"],"Heat stroke is a medical emergency. Call 911."],
  ["What do Good Samaritan laws generally do?","Protect people who help in an emergency in good faith",["Require payment for help","Ban bystanders from helping"],"Details vary by state, but the idea is to encourage helping."]]
}},
{ id:"substance", cat:"Health", icon:"🚭", name:"Medicine & Substance Safety", q:{
 k2:[
  ["Who should give you medicine?","A trusted adult, like a parent or the nurse",["A friend","Anyone"],"Only take medicine from a trusted adult."],
  ["Some medicine looks like candy. What should you do?","Only take it from a trusted adult",["Eat it","Share it"],"Medicine is not candy."],
  ["Cigarette smoke is...","Bad for your lungs",["Good for you","Like fresh air"],"Clean air keeps your lungs healthy."],
  ["Which helps your body stay healthy?","Sleep, water, and healthy food",["Smoking","Taking someone else's medicine"],"Healthy habits help you grow strong."],
  ["Who should use cleaning products under the sink?","Only adults",["Kids","Pets"],"Cleaning products can be poisonous."],
  ["Saying no to something unsafe is...","Brave and smart",["Rude","Silly"],"It's always okay to say no to unsafe things."]],
 g35:[
  ["Nicotine, found in cigarettes and vapes, is...","Addictive",["A vitamin","Healthy"],"Addictive means it's very hard to stop once you start."],
  ["What is secondhand smoke?","Smoke you breathe in from someone else's cigarette",["A type of fog","Steam from a shower"],"Secondhand smoke can hurt people nearby."],
  ["Why are vapes harmful?","They contain nicotine and chemicals that can harm your lungs",["They're just water","They're safe for kids"],"Vapes are not harmless water vapor."],
  ["Is it safe to take someone else's prescription medicine?","No, it's unsafe",["Yes, if they're a friend","Yes, if it's a small amount"],"Prescriptions are made for one specific person."],
  ["What's a good way to refuse something unsafe?","Say 'No thanks' and walk away",["Say maybe","Try it once"],"Clear, confident refusals work best."],
  ["If someone may have swallowed poison, what can adults call?","Poison Control at 1-800-222-1222",["The pizza place","A friend"],"Poison Control experts are available 24/7."]],
 g68:[
  ["How can nicotine affect the teen brain?","It can harm attention, learning, and impulse control",["It improves focus","It has no effect"],"The teen brain is still developing, which makes it more sensitive to nicotine."],
  ["Which is a refusal skill?","Suggesting a different activity",["Giving in to fit in","Staying silent"],"Offering an alternative gives everyone a way out."],
  ["Peer pressure can be...","Positive or negative",["Only negative","Only positive"],"Friends can push you toward good choices too."],
  ["What kind of drug is alcohol?","A depressant that slows the brain and body",["A stimulant that speeds you up","A vitamin"],"Alcohol slows reaction time and affects judgment."],
  ["When is over-the-counter medicine safest?","When taken exactly as the label directs",["When you take extra","When mixed with other medicines"],"Always follow the label or a doctor's directions."],
  ["What does addiction mean?","Being unable to stop using a substance even when it causes harm",["Liking a hobby","Being tired"],"Addiction changes how the brain works."]],
 g912:[
  ["Why is mixing alcohol with opioids dangerous?","It can slow breathing to a deadly level",["It cancels them out","It's safe in small amounts"],"Combining depressants multiplies the risk."],
  ["What is naloxone (Narcan) used for?","Reversing an opioid overdose",["Treating headaches","Boosting energy"],"Naloxone can save a life. Call 911 too."],
  ["Why is fentanyl so dangerous?","A tiny amount can be deadly, and it's often hidden in other drugs",["It's always labeled","It's weak"],"Counterfeit pills often contain fentanyl."],
  ["What affects blood alcohol concentration (BAC)?","Body size, amount consumed, and time",["Only the brand of drink","Shoe size"],"BAC rises faster than many people expect."],
  ["Which are signs of an opioid overdose?","Slow or stopped breathing and pinpoint pupils",["Excitement","Fast breathing"],"Call 911 immediately."],
  ["What is the legal drinking age in the United States?","21",["16","18"],"It's 21 in all 50 states."]]
}}
];

UNITS.push(
{ id:"dance", cat:"PE", icon:"🤸", name:"Dance, Rhythm & Gymnastics", q:{
 k2:[
  ["What is the beat in music?","The steady pulse you can clap to",["The words of a song","How loud the music is"],"Clapping or stepping to the beat helps you move in rhythm."],
  ["When you balance on one foot, what helps you stay steady?","Look at one spot and hold your arms out",["Close your eyes and spin","Wiggle your whole body"],"A focus spot and wide arms help you stay balanced."],
  ["What's the safe way to do a log roll?","Keep your body long and straight and roll sideways",["Roll on your head","Roll off a table"],"Log rolls stay low on the mat with your body stretched long like a pencil."],
  ["Copying your partner's moves like a mirror is called...","Mirroring",["Racing","Hiding"],"Mirroring means you move exactly how your partner moves, at the same time."],
  ["In a three-point balance, how many body parts touch the floor?","Three",["One","Ten"],"Try two hands and one foot, or two feet and one hand."],
  ["In freeze dance, what do you do when the music stops?","Freeze in a shape",["Keep dancing","Run away"],"Freezing shows control and good listening."]],
 g35:[
  ["What is tempo?","How fast or slow the music is",["How loud it is","Who is singing"],"Fast tempo means quick moves. Slow tempo means slow moves."],
  ["What is a weight transfer in gymnastics?","Moving your body weight from one body part to another",["Lifting weights","Standing still"],"Rocking, rolling, and cartwheels all transfer weight."],
  ["Before a forward roll, where should your chin be?","Tucked to your chest",["Pointed up","Touching the mat first"],"A tucked chin protects your head and neck."],
  ["Which shows a strong balance?","Holding still with tight muscles for 3 seconds",["Wobbling and falling","Holding for less than a second"],"Tight muscles and a focus point make balances steady."],
  ["A set of dance moves done in order is called a...","Sequence",["Penalty","Timeout"],"Putting moves in order turns them into a dance sequence."],
  ["What are folk dances?","Traditional dances passed down in a culture or community",["Dances made up only for TV","Strength exercises"],"Folk dances help us learn about people and cultures around the world."]],
 g68:[
  ["Dance steps are usually counted in groups of...","8",["3","20"],"Dancers count in 8s: 5, 6, 7, 8 is the start signal."],
  ["What is choreography?","Planning and arranging movements into a dance",["Stretching after class","Keeping score"],"Choreographers design the steps, formations, and timing of a dance."],
  ["In gymnastics, a wide base of support helps with...","Stability",["Speed","Flexibility"],"A wider base makes it harder to tip over."],
  ["Which dance element describes where you move, like levels, pathways, and directions?","Space",["Time","Energy"],"The elements of dance are body, energy, space, and time."],
  ["What is a counterbalance?","Partners lean away from each other and use each other's weight to stay balanced",["Balancing alone on one foot","Falling on purpose"],"Counterbalances need trust and matching force from both partners."],
  ["Why is dance a good lifetime activity?","It builds fitness and can be enjoyed at any age",["It only works for kids","It doesn't count as exercise"],"Social, line, and cultural dance keep people active for life."]],
 g912:[
  ["What do the letters in BEST stand for as elements of dance?","Body, Energy, Space, Time",["Balance, Endurance, Speed, Tempo","Beat, Energy, Step, Turn"],"BEST is a common way to remember the four elements of dance."],
  ["What is syncopation?","Accenting a beat that's normally weak or off-beat",["Dancing perfectly on every beat","Stopping the music"],"Syncopation adds surprise and style to rhythm."],
  ["Sustained aerobic or social dance mainly builds...","Cardiorespiratory endurance",["Only flexibility","Body temperature"],"Continuous dancing keeps your heart rate up the way jogging does."],
  ["A cartwheel is an example of...","Rotation with weight transfer from hands to feet",["A static balance","A jump"],"Cartwheels rotate your body sideways while weight moves hand, hand, foot, foot."],
  ["Why do dancers and gymnasts spot a fixed point when turning?","To stay oriented and reduce dizziness",["To look at the judges","To slow down"],"Spotting keeps your eyes and balance system steady during turns."],
  ["What is canon in choreography?","Dancers perform the same movement starting at different times",["Everyone moves in unison","A solo dance"],"Canon creates a ripple effect, like a round in music."]]
}},
{ id:"testing", cat:"PE", icon:"📊", name:"Fitness Testing & Goals", q:{
 k2:[
  ["Why do we check our fitness?","To see how our bodies get stronger over time",["To see who's the best","To win a prize"],"Fitness checks compare you to you, not to your friends."],
  ["A pedometer counts your...","Steps",["Heartbeats","Friends"],"A pedometer clips on and counts every step you take."],
  ["What is a goal?","Something you want to get better at and work toward",["Something you already finished","A type of snack"],"Goals help you practice and improve."],
  ["Which is a good fitness goal?","I will jump rope 10 more times than last week",["I will never exercise","I will be faster than everyone"],"Good goals are about beating your own best."],
  ["After running, where can you feel your heartbeat?","On your chest or wrist",["On your elbow","On your hair"],"Your heart beats faster after you move."],
  ["In the PACER, you run back and forth to...","Beeps",["Only music","A whistle every minute"],"Each beep tells you when to reach the other line."]],
 g35:[
  ["What does the curl-up test measure?","Core strength and endurance",["Flexibility","Speed"],"Curl-ups check how well your stomach muscles keep working."],
  ["The back-saver sit and reach tests one leg at a time for...","Flexibility in the back of the legs",["Arm strength","Heart health"],"Keeping one knee bent protects your lower back during the test."],
  ["What does the trunk lift test measure?","Back strength and flexibility",["Leg speed","Balance on one foot"],"Lifting slowly and with control protects your back."],
  ["In the cadence push-up test, you keep pace with...","A steady beat",["Your friend","The fastest person"],"The cadence keeps every push-up the same speed."],
  ["In a SMART goal, what does S stand for?","Specific",["Super","Speed"],"SMART goals are Specific, Measurable, Attainable, Realistic, and Timely."],
  ["What is the Healthy Fitness Zone?","A score range that shows healthy fitness for your age",["A place in the gym","The top 10 students"],"Everyone can reach their Healthy Fitness Zone."]],
 g68:[
  ["What is a criterion-referenced fitness test?","One that compares you to a health standard, not to other students",["One that ranks the class","One graded on effort only"],"FitnessGram uses health standards, so everyone can succeed."],
  ["Which tool shows exercise intensity in real time?","A heart rate monitor",["A tape measure","A calendar"],"Heart rate monitors show how hard your heart is working right now."],
  ["In a SMART goal, what does M stand for?","Measurable",["Mighty","Maximum"],"Measurable means you can track your progress with numbers."],
  ["Which is the best SMART goal?","I'll add 5 PACER laps in six weeks by jogging 3 days a week",["I want to be fit","I'll run more sometime"],"It's specific, measurable, and has a timeline."],
  ["What does an accelerometer, like in a fitness watch, measure?","Movement and activity levels",["Body temperature","Blood type"],"Accelerometers sense motion to estimate how active you are."],
  ["Why retest fitness later in the year?","To track progress toward your goals",["To punish low scores","It isn't useful"],"Pre- and post-tests show how your training worked."]],
 g912:[
  ["Which FitnessGram test measures aerobic capacity?","PACER",["Trunk lift","Back-saver sit and reach"],"The PACER estimates how well your heart and lungs deliver oxygen."],
  ["When is the best time to measure resting heart rate?","Right after waking up, before getting out of bed",["Right after a workout","After drinking coffee"],"That's when your body is most at rest."],
  ["What should a personal fitness plan include?","Goals, FITT details, a timeline, and a way to track progress",["Only a list of sports","Just a start date"],"A complete plan tells you what, when, how hard, and how you'll measure it."],
  ["Which is an example of fitness self-assessment?","Comparing your scores to your own past results",["Comparing yourself to pro athletes","Guessing without testing"],"Self-assessment focuses on your own growth."],
  ["You've stopped improving on a goal. What's a good adjustment?","Change one FITT variable, like intensity or type",["Quit the goal","Do the exact same workout forever"],"Small changes create new challenges for your body."],
  ["In a SMART goal, what does R stand for?","Realistic",["Rapid","Repeat"],"Realistic goals stretch you but are still reachable."]]
}},
{ id:"active", cat:"PE", icon:"🚴", name:"Active Lifestyle", q:{
 k2:[
  ["Which is a way to be active at home?","Dancing, playing tag, or riding a bike",["Watching TV all day","Sitting and playing video games"],"Moving your body at home counts too."],
  ["What's an activity you can do with your family?","Going for a walk together",["Napping all afternoon","Watching a movie"],"Family walks, bike rides, and games keep everyone healthy."],
  ["How does being active help you?","You feel happy and stay healthy",["It makes you sick","It makes you sleepy all day"],"Moving helps your body and your mood."],
  ["Where can you play outside safely?","A park or playground with an adult nearby",["In the street","Alone near a pond"],"Safe places and grown-ups nearby keep play fun."],
  ["You've been sitting a long time. What should you do?","Get up and move around",["Keep sitting","Fall asleep"],"Short movement breaks wake up your body and brain."],
  ["Which toy helps you be active?","A jump rope",["A puzzle","A coloring book"],"Jump ropes, balls, and hoops get you moving."]],
 g35:[
  ["Which is a physical activity outside of school?","Joining a rec soccer team or going swimming",["Doing homework","Watching sports on TV"],"Clubs, teams, and family activities keep you active beyond P.E."],
  ["How can you add more activity to your day?","Walk or bike instead of riding in a car, when it's safe",["Take the elevator every time","Stay inside at recess"],"Small choices add up to big activity."],
  ["What's a community resource for staying active?","Parks, trails, and recreation centers",["A movie theater","A drive-thru"],"Many communities have free places to play and exercise."],
  ["Why find activities you enjoy?","You're more likely to keep doing them",["It doesn't matter","So you can quit sooner"],"Fun activities become lifelong habits."],
  ["What should sitting-still screen time be balanced with?","Active time",["More screen time","Snacks"],"Balance screens with play, sports, and movement."],
  ["Which is an active chore?","Raking leaves",["Watching TV","Playing a phone game"],"Chores like raking, sweeping, and gardening get you moving."]],
 g68:[
  ["What does sedentary mean?","Sitting or lying down with very little movement",["Running fast","Lifting weights"],"Too much sedentary time is linked to health problems."],
  ["Which is a lifetime activity?","Hiking or cycling",["Recess tag","Dodgeball tournaments"],"Lifetime activities are easy to keep doing as an adult."],
  ["What is energy balance?","Calories eaten compared with calories used",["Balancing on one foot","Sleeping 8 hours"],"Food gives energy, and activity uses it."],
  ["Lack of time is a common barrier to activity. What's a good solution?","Fit in short 10-minute bursts of activity",["Give up on exercise","Only exercise once a month"],"Short bouts throughout the day add up."],
  ["What are outdoor pursuits?","Activities like hiking, kayaking, and orienteering",["Indoor video games","Reading outside"],"Outdoor pursuits build fitness and confidence in nature."],
  ["Why track your activity in a log or app?","To see patterns and stay motivated",["To compare with influencers","It's required by law"],"Tracking helps you notice progress."]],
 g912:[
  ["What does energy balance mean?","Energy taken in from food roughly equals energy used",["Eating nothing","Only exercising"],"Balance supports a healthy weight and plenty of energy."],
  ["If energy intake is regularly more than energy used, the body tends to...","Gain weight over time",["Get faster","Need less sleep"],"Energy balance is about long-term patterns, not single meals."],
  ["What's a good way to stay active after high school?","Choose activities you enjoy and can access, like a gym, league, or trail",["Stop once school ends","Only exercise before events"],"Access and enjoyment keep adults active."],
  ["Teens should do muscle-strengthening activity at least how many days a week?","3",["1","7"],"This is part of the recommended 60 minutes a day."],
  ["What most helps adults stick with exercise?","Enjoyment and social support",["Expensive equipment","Extreme workouts"],"People keep doing activities they like, with people they like."],
  ["What is active transportation?","Walking or biking to get places",["Driving fast","Taking a taxi"],"Active transportation builds fitness into daily life."]]
}},
