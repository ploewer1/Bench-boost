{ id:"habits", cat:"Health", icon:"😴", name:"Healthy Habits: Sleep, Screens & Checkups", q:{
 k2:[
  ["About how much sleep do kids need each night?","About 10–11 hours",["2 hours","20 hours"],"Sleep helps your body grow and your brain learn."],
  ["What helps you fall asleep?","A calm bedtime routine, like reading a book",["Playing video games in bed","Eating candy"],"Quiet, calm activities help your body get ready for sleep."],
  ["Who helps keep you healthy?","Doctors, nurses, dentists, and parents",["Only your friends","No one"],"Lots of grown-ups help keep kids healthy."],
  ["Why do you visit the dentist?","To keep your teeth healthy",["To get candy","To play games"],"Dentists clean and check your teeth."],
  ["What's a good thing to do before bed?","Brush your teeth",["Eat a big snack","Watch scary videos"],"Brushing before bed keeps germs off your teeth all night."],
  ["When should screens be turned off?","Before bedtime",["Never","In the middle of the night"],"Turning off screens helps you fall asleep."]],
 g35:[
  ["Why can screens before bed make it hard to sleep?","The bright light keeps your brain awake",["Screens make you hungry","They don't affect sleep"],"Try turning screens off an hour before bed."],
  ["What is a regular checkup?","A doctor visit to make sure you're healthy, even when you're not sick",["A visit only when you're hurt","A school test"],"Checkups catch problems early."],
  ["Which is a healthy screen-time habit?","Taking breaks to move and rest your eyes",["Staring at a screen for hours","Using screens during meals"],"Movement breaks help your eyes and body."],
  ["Why does going to bed at the same time each night help?","It keeps your body on a steady sleep schedule",["It makes you taller","It doesn't matter"],"A steady schedule makes falling asleep easier."],
  ["What does good posture look like when using a device?","Sitting up straight with the screen at eye level",["Hunching over your lap","Lying on your stomach"],"Good posture protects your neck and back."],
  ["How does sleep help you in school?","It helps you focus, remember, and learn",["It doesn't help","It makes you forget things"],"Your brain stores what you learned while you sleep."]],
 g68:[
  ["What is the body's natural 24-hour sleep-wake cycle called?","Circadian rhythm",["Heart rate","Metabolism"],"Light and routine help set your circadian rhythm."],
  ["Which habit improves sleep quality?","Keeping the bedroom dark, quiet, and cool",["Sleeping with the TV on","Drinking soda at night"],"A dark, quiet, cool room signals your body to rest."],
  ["Too much sedentary screen time is linked to...","Less physical activity and poorer sleep",["Better fitness","Stronger bones"],"Balancing screens with movement protects your health."],
  ["Why get vision and hearing screenings?","To catch problems early",["They're only for adults","To pick glasses colors"],"Early care helps you learn and stay safe."],
  ["Which is a sign of not getting enough sleep?","Trouble concentrating and irritability",["Having too much energy","Better grades"],"Teens need 8–10 hours to feel and focus their best."],
  ["Why keep earbud volume low?","Loud sound over time can damage hearing",["It saves battery","Songs sound worse loud"],"If others can hear your music, it's probably too loud."]],
 g912:[
  ["How does teens' natural sleep timing tend to shift?","Later, which makes early mornings harder",["Earlier","It stops changing"],"Planning a consistent bedtime helps work with this shift."],
  ["Which is part of good sleep hygiene?","Avoiding caffeine in the afternoon and evening",["Napping for hours after school","Scrolling in bed"],"Caffeine can stay in your system for hours."],
  ["What is preventive care?","Health care that helps prevent illness, like checkups and vaccines",["Only emergency care","Surgery"],"Preventing problems is easier than treating them."],
  ["How can blue light from screens at night affect sleep?","It can delay the release of melatonin",["It makes you sleep instantly","It has no effect"],"Melatonin is the hormone that helps you feel sleepy."],
  ["How can doomscrolling affect your health?","It can increase stress and cut into sleep",["It improves mood","It builds focus"],"Setting app limits can protect your time and mood."],
  ["Which is a SMART goal for better sleep?","I'll put my phone away by 10 p.m. on school nights for 3 weeks",["I'll sleep better someday","I'll try to be less tired"],"Specific, measurable, and time-bound goals are easier to keep."]]
}},
{ id:"violence", cat:"Health", icon:"🛡️", name:"Violence & Bullying Prevention", q:{
 k2:[
  ["What is bullying?","Hurting or teasing someone on purpose, again and again",["Playing a fair game","Saying good morning"],"Bullying is on purpose and happens more than once."],
  ["If someone keeps being mean to you, what should you do?","Tell a trusted adult",["Keep it a secret","Be mean back"],"Trusted adults can help make it stop."],
  ["What's a safe way to solve a problem with a friend?","Use your words and take turns talking",["Push them","Yell"],"Calm words solve problems better than hands."],
  ["If someone touches you in a way that feels unsafe, what should you do?","Say no, get away, and tell a trusted adult",["Keep it a secret","Do nothing"],"You can always tell a trusted adult, and it's never your fault."],
  ["When you feel angry, is it okay to hit?","No, use calm words instead",["Yes, if you're really mad","Only at home"],"Take a breath and use your words."],
  ["What can you do if you see someone being bullied?","Tell an adult and be kind to them",["Laugh","Join in"],"Helping others makes school safe for everyone."]],
 g35:[
  ["What's the difference between teasing and bullying?","Bullying is repeated and meant to hurt",["There's no difference","Teasing is always bullying"],"When teasing is repeated and hurtful, it becomes bullying."],
  ["What is an upstander?","Someone who safely speaks up or gets help when someone is treated badly",["Someone who watches and laughs","Someone who stands on a chair"],"Upstanders make it harder for bullying to continue."],
  ["What is cyberbullying?","Bullying that happens online or through texts",["A computer virus","A video game"],"Save the messages and tell a trusted adult."],
  ["Which is a peaceful way to resolve conflict?","Calmly talk it out and look for a compromise",["Fight it out","Spread rumors"],"Listening to both sides helps find a fair solution."],
  ["If a situation feels unsafe, who should you tell?","A trusted adult",["No one","Only a friend"],"Trusted adults like parents, teachers, and counselors can help."],
  ["Which is an example of showing respect?","Treating others the way you want to be treated",["Ignoring people you don't know","Making fun of differences"],"Respect makes everyone feel safe and included."]],
 g68:[
  ["What is a bystander?","Someone who sees bullying but isn't directly involved",["The person bullying","The principal"],"Bystanders can choose to become upstanders."],

function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function sample(a,n){ return shuffle(a).slice(0,n); }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function fmtN(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,','); }
function mk(q,c,w,e){ const seen=new Set([c]), ws=[]; w.forEach(x=>{ if(!seen.has(x)){ seen.add(x); ws.push(x); } }); return [q,c,ws.slice(0,3),e]; }
function numW(c,cands,f){
  const used=new Set([c]), out=[];
  cands.forEach(v=>{ if(v>0 && !used.has(v)){ used.add(v); out.push(v); } });
  const st=Math.max(1,Math.round(c*0.1));
  for(let k=1;out.length<3&&k<20;k++){ [c+st*k,c-st*k].forEach(v=>{ if(v>0&&!used.has(v)&&out.length<3){ used.add(v); out.push(v); } }); }
  return out.slice(0,3).map(f);
}

function catGen(s){
  const names=Object.keys(s.cats);
  const which=()=>{ const c=pick(names), it=pick(s.cats[c]); const pool=[]; names.forEach(k=>{ if(k!==c) s.cats[k].forEach(x=>pool.push(x)); });
    return mk(s.ask(c), cap(it), sample(pool,3).map(cap), s.exp(it,c)); };
  const group=()=>{ const c=pick(names), it=pick(s.cats[c]); return mk(s.askItem(it), c, sample(names.filter(k=>k!==c),3), s.exp(it,c)); };
  return [which, group];
}

function pairGen(pairs){
  const fwd=()=>{ const p=pick(pairs); return mk(`What is the main job of your ${p[0]}?`, cap(p[1]), sample(pairs.filter(x=>x!==p).map(x=>cap(x[1])),3), `The main job of your ${p[0]} is ${p[1]}.`); };

  return [fwd,rev];
}

/* Number generators */
function genMaxHR(){ const age=12+Math.floor(Math.random()*7), c=220-age;
  return mk(`Using 220 minus age, what is the estimated maximum heart rate for a ${age}-year-old?`, `${c} beats per minute`, numW(c,[c+10,c-10,200-age,220+age],v=>`${v} beats per minute`), `220 − ${age} = ${c} beats per minute. It's an estimate.`); }
function genTargetHR(){ const age=12+Math.floor(Math.random()*7), p=pick([60,70,80]), m=220-age, c=Math.round(m*p/100);
  const others=[50,60,70,80,90].filter(x=>x!==p).map(x=>Math.round(m*x/100));
  return mk(`Using 220 minus age, what is ${p}% of the maximum heart rate for a ${age}-year-old?`, `${c} beats per minute`, numW(c,others.concat([Math.round(220*p/100)]),v=>`${v} beats per minute`), `220 − ${age} = ${m}, and ${p}% of ${m} is about ${c} beats per minute.`); }
function genPulse(){ const n=8+Math.floor(Math.random()*9), c=n*6;
  return mk(`You count ${n} heartbeats in 10 seconds. About how many beats per minute is that?`, `${c} beats per minute`, numW(c,[n*4,n*10,n*12,n*3],v=>`${v} beats per minute`), `${n} × 6 = ${c}, because a minute has six 10-second periods.`); }
function genCalories(){ const c=15+5*Math.floor(Math.random()*7), p=5+5*Math.floor(Math.random()*5), f=2+2*Math.floor(Math.random()*6), t=4*c+4*p+9*f;
  return mk(`A snack has ${c} g of carbohydrate, ${p} g of protein, and ${f} g of fat. About how many calories is that?`, `${t} calories`, numW(t,[4*(c+p+f),9*(c+p+f),4*c+4*p,4*c+9*p+9*f],v=>`${v} calories`), `Carbs: ${c} × 4 = ${4*c}. Protein: ${p} × 4 = ${4*p}. Fat: ${f} × 9 = ${9*f}. Total = ${t} calories.`); }
function genCalSimple(){ const nu=pick([['carbohydrate',4],['protein',4],['fat',9]]), g=5*(1+Math.floor(Math.random()*6)), c=g*nu[1];
  return mk(`A food has ${g} grams of ${nu[0]} and nothing else. About how many calories is that?`, `${c} calories`, numW(c,[g*(nu[1]===4?9:4),g*7,g*2,g+nu[1]],v=>`${v} calories`), `Each gram of ${nu[0]} has ${nu[1]} calories, so ${g} × ${nu[1]} = ${c}.`); }
function genCO(){ const hr=60+5*Math.floor(Math.random()*9), sv=50+5*Math.floor(Math.random()*9), c=hr*sv;
  return mk(`A heart beats ${hr} times per minute and pumps ${sv} mL with each beat. What is the cardiac output?`, `${fmtN(c)} mL per minute`, numW(c,[c*10,Math.round(c/10),c+1000,c-1000],v=>`${fmtN(v)} mL per minute`), `Cardiac output = heart rate × stroke volume: ${hr} × ${sv} = ${fmtN(c)} mL per minute.`); }
function genActiveKids(){ if(Math.random()<0.5){ const m=pick([15,20,25,30,35,40,45]), c=60-m;
    return mk(`Kids need 60 minutes of activity a day. You got ${m} minutes in P.E. How many more minutes do you need today?`, `${c} minutes`, numW(c,[m,60+m,120-m],v=>`${v} minutes`), `60 − ${m} = ${c} minutes to go.`); }
  const d=3+Math.floor(Math.random()*5), c=60*d;
  return mk(`How many minutes of activity is 60 minutes a day for ${d} days?`, `${c} minutes`, numW(c,[60+d,d*6,d*30],v=>`${v} minutes`), `60 × ${d} = ${c} minutes.`); }
function genActiveWeek(){ const m=pick([30,45,60,75,90,105,120]), c=150-m;
  return mk(`The goal is 150 minutes of moderate activity per week. You've done ${m}. How many minutes are left?`, `${c} minutes`, numW(c,[150+m,m,300-m,Math.round(c/2)],v=>`${v} minutes`), `150 − ${m} = ${c} minutes left.`); }
function sleepGen(ages,adult){
  const R=['10–13 hours','9–12 hours','8–10 hours','7 or more hours'];
  return ()=>{ let who, r;
    if(adult && Math.random()<0.25){ who='an adult'; r=R[3]; }
    else { const a=pick(ages); who=`${(a===8||a===11||a===18)?'an':'a'} ${a}-year-old`; r=a<=5?R[0]:a<=12?R[1]:R[2]; }
    return mk(`About how many hours of sleep does ${who} need each night?`, r, R.filter(x=>x!==r), `${cap(who)} needs ${r} of sleep. Enough sleep helps you learn, grow, and stay healthy.`); };
}

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

    </div>
    <div class="sendok" id="${prefix}Ok" style="display:none"></div>
  </div>`;

function bindSendBox(prefix, subjectFn, bodyFn, onSent){
  const nameEl = document.getElementById(prefix+'Name'), emailEl = document.getElementById(prefix+'Email'),
        errEl = document.getElementById(prefix+'Err'), okEl = document.getElementById(prefix+'Ok'),
        sendBtn = document.getElementById(prefix+'Send'), copyBtn = document.getElementById(prefix+'Copy');
  if(!sendBtn) return;
  function validated(){
    const name = nameEl.value.trim(), email = emailEl.value.trim();
    if(!name){ errEl.textContent = "Enter your name first."; errEl.style.display='block'; return null; }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ errEl.textContent = "Enter a valid teacher email."; errEl.style.display='block'; return null; }
    errEl.style.display = 'none';
    return { name, email };
  }
  sendBtn.onclick = ()=>{
    const v = validated(); if(!v) return;
    const subject = subjectFn(v.name), body = bodyFn(v.name);
    window.location.href = 'mailto:'+encodeURIComponent(v.email)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
    nameEl.value=''; emailEl.value='';
    okEl.style.display='block'; okEl.textContent="Email opened below (or in your mail app) \u2014 tap send there to finish. Your name has been cleared from this device.";
    if(onSent) onSent();
  };
  copyBtn.onclick = ()=>{
    const v = validated(); if(!v) return;
    const text = subjectFn(v.name)+"\n\n"+bodyFn(v.name);
    const done = ()=>{ okEl.style.display='block'; okEl.textContent="Copied! Paste it into an email to your teacher. Your name has been cleared from this device."; nameEl.value=''; emailEl.value=''; if(onSent) onSent(); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(()=>{ errEl.textContent="Couldn't copy automatically \u2014 try the email button instead."; errEl.style.display='block'; }); }
    else { errEl.textContent="Copy isn't available here \u2014 try the email button instead."; errEl.style.display='block'; }
  };
}

/* ---------- question engine + extra game modes ---------- */
let lr = null, fact = null, sortG = null, gameTimer = null, advTimer = null, seenMem = null;
function clearTimers(){ if(gameTimer){ clearInterval(gameTimer); gameTimer = null; } if(advTimer){ clearTimeout(advTimer); advTimer = null; } lr = null; }
function toQ(u,x,extra,gen){ return { q:x[0], correct:x[1], opts:shuffle([x[1]].concat(x[2])), exp:x[3], unit:u.name, icon:u.icon, extra:!!extra, gen:!!gen }; }
function seenKey(){ return 'seen_'+settings.band+'_'+settings.unit; }
function markSeen(q){
  if(q.gen || q.extra) return;
  const k = seenKey();
  if(!seenMem || seenMem.k !== k) seenMem = { k, set:new Set(store.get(k, [])) };
  seenMem.set.add(q.q); store.set(k, Array.from(seenMem.set));
}
function genFor(){ const out = []; unitsFor(settings.unit).forEach(u=>{ ((GEN[u.id]||{})[settings.band]||[]).forEach(fn=>out.push({ u, fn })); }); return out; }
function sortSetsFor(band){ const out = []; unitsFor(settings.unit).forEach(u=>{ CATSETS.filter(s=>s.unit===u.id && s.bands.indexOf(band)>=0).forEach(s=>out.push({ u, s })); }); return out; }
/* Draw n questions: unseen written ones first, then freshly generated ones. Repeats only after the bank is used up. */
function draw(n, lazy){
  const band = settings.band, main = unitsFor(settings.unit), stat = [];
  main.forEach(u=>(u.q[band]||[]).forEach(x=>stat.push(toQ(u,x,false))));
  const gens = genFor(), k = seenKey();
  let seen = new Set(store.get(k, []));
  let unseen = stat.filter(q=>!seen.has(q.q));
  if(!unseen.length && stat.length){ seen = new Set(); store.set(k, []); unseen = stat.slice(); }
  seenMem = { k, set:seen };
  const wantGen = gens.length ? Math.round(n*0.4) : 0;
  const chosen = [], texts = new Set();
  const add = q => { if(texts.has(q.q)) return false; texts.add(q.q); chosen.push(q); return true; };
  shuffle(unseen).slice(0, n-wantGen).forEach(add);
  let guard = 0;
  while(chosen.length < n && gens.length && guard++ < n*30){ const g = pick(gens); add(toQ(g.u, g.fn(), false, true)); }
  if(chosen.length < n) shuffle(stat).forEach(q=>{ if(chosen.length < n) add(q); });
  if(chosen.length < n && main.length === 1){
    const extra = [];
    UNITS.filter(u=>u.cat===main[0].cat && u.id!==main[0].id).forEach(u=>(u.q[band]||[]).forEach(x=>extra.push(toQ(u,x,true))));
    shuffle(extra).forEach(q=>{ if(chosen.length < n) add(q); });
  }
  if(!lazy) chosen.forEach(markSeen);
  return shuffle(chosen);
}
function starsFor(pct){ return pct>=0.9?3:pct>=0.7?2:pct>=0.4?1:0; }
function trackHTML(results, i, total){ let h = ''; for(let k=0;k<total;k++) h += `<i class="${k<results.length?(results[k]?'ok':'no'):(k===i?'now':'')}"></i>`; return h; }

/* ---- Lightning Round ---- */
function startLightning(){
  const secs = settings.band === 'k2' ? 90 : 60;
  lr = { qs:draw(60, true), i:0, correct:0, wrong:0, streak:0, answered:false, pick:null, secs, end:Date.now()+secs*1000 };
  renderLightning();
  gameTimer = setInterval(tickLightning, 250);
}
function renderLightning(){
  const L = lr; if(!L) return;
  const cur = L.qs[L.i];
  if(!cur){ endLightning(); return; }
  markSeen(cur);
  const answers = cur.opts.map((o,k)=>{ let c = ''; if(L.answered){ c = o===cur.correct ? 'right' : (k===L.pick ? 'wrong' : 'dim'); }
    return `<button class="ans a${k%4} ${c}" data-k="${k}" ${L.answered?'disabled':''}><span class="spot">${'ABCD'[k]}</span><span>${esc(o)}</span></button>`; }).join('');
  const left = Math.max(0, Math.ceil((L.end-Date.now())/1000));
  app.innerHTML = top(true) + `<div class="wrap"><div class="qbar"><span class="timer" id="tm">⏱ ${left}s</span><span>${L.correct} right${L.streak>=3?` <span class="streak">🔥 ${L.streak}</span>`:''}</span></div>
    <div class="card qcard"><p class="qtext">${esc(cur.q)}</p><div class="answers">${answers}</div></div></div>`;
  bindGear(); window.scrollTo(0,0);
  app.querySelectorAll('.ans').forEach(b=>b.onclick=()=>lrAnswer(+b.dataset.k));
}
function lrAnswer(k){
  const L = lr; if(!L || L.answered) return;
  const cur = L.qs[L.i]; L.answered = true; L.pick = k;
  const ok = cur.opts[k] === cur.correct;
  if(ok){ L.correct++; L.streak++; } else { L.wrong++; L.streak = 0; }
  renderLightning();
  advTimer = setTimeout(()=>{ if(!lr) return; lr.i++; lr.answered = false; lr.pick = null; renderLightning(); }, ok ? 450 : 1100);
}
function tickLightning(){
  const L = lr; if(!L) return;
  const ms = L.end - Date.now(), el = document.getElementById('tm');
  if(el) el.textContent = '⏱ ' + Math.max(0, Math.ceil(ms/1000)) + 's';
  if(ms <= 0) endLightning();
}
function endLightning(){
  const L = lr; clearTimers(); if(!L) return;
  const perMin = L.correct / L.secs * 60;
  renderScore({ mode:'Lightning Round', headline:`${L.correct} right in ${L.secs} seconds`, sub:`${L.correct} correct, ${L.wrong} missed.`,
    stars: perMin>=15?3:perMin>=10?2:perMin>=5?1:0, pts:L.correct*10, bestKey:'best_lightning_'+settings.band+'_'+settings.unit, bestVal:L.correct, again:startLightning });
}

/* ---- Fact Check ---- */
function startFact(){
  const qs = draw(settings.rounds).map(q=>{ const truth = Math.random() < 0.5; return Object.assign({}, q, { truth, claim: truth ? q.correct : pick(q.opts.filter(o=>o!==q.correct)) }); });
  fact = { qs, i:0, score:0, pts:0, streak:0, results:[], answered:false, pick:null, spoken:false };
  renderFact();
}
function renderFact(){
  const F = fact, cur = F.qs[F.i], done = F.answered, mix = settings.unit.startsWith('mix');
  const right = done && F.pick === cur.truth, last = F.i === F.qs.length-1;
  const tCls = done ? (cur.truth ? 'right' : (F.pick===true ? 'wrong' : 'dim')) : '';
  const fCls = done ? (!cur.truth ? 'right' : (F.pick===false ? 'wrong' : 'dim')) : '';
  app.innerHTML = top(true) + `<div class="wrap">
    <div class="qbar"><span>Statement ${F.i+1} of ${F.qs.length}</span><span>${F.pts} points${F.streak>=2?` <span class="streak">🔥 ${F.streak} in a row</span>`:''}</span></div>
    <div class="track">${trackHTML(F.results, F.i, F.qs.length)}</div>
    <div class="card qcard"><div class="qhead"><div>${(mix||cur.extra)?`<span class="qtag">${cur.icon} ${esc(cur.unit)}</span>`:''}<p class="qtext">${esc(cur.q)}</p></div>
      ${canSpeak?`<button class="speak" id="say" aria-label="Read aloud">🔊</button>`:''}</div>
      <div class="claim"><small>A student says the answer is:</small><strong>${esc(cur.claim)}</strong></div>
      <div class="answers tf"><button class="ans a2 ${tCls}" id="tfT" ${done?'disabled':''}><span>✅ That's right</span></button><button class="ans a1 ${fCls}" id="tfF" ${done?'disabled':''}><span>❌ That's wrong</span></button></div>
      ${done?`<div class="feedback ${right?'good':'bad'}"><strong>${right?'You got it!':'Not quite.'}</strong>That answer was ${cur.truth?'right':'wrong'}. ${cur.truth?'':'The right answer is '+esc(cur.correct)+'. '}${esc(cur.exp)}</div>
        <div class="row nextrow"><button class="btn blue" id="next">${last?'See my results':'Next statement'}</button></div>`:''}
    </div></div>`;
  bindGear();
  const say = document.getElementById('say'); if(say) say.onclick = ()=>speak(cur.q+'. A student says the answer is: '+cur.claim+'. Is that right?');
  if(!done){
    document.getElementById('tfT').onclick = ()=>factPick(true);
    document.getElementById('tfF').onclick = ()=>factPick(false);
    if(settings.speak && !F.spoken){ F.spoken = true; speak(cur.q+'. A student says the answer is: '+cur.claim+'. Is that right?'); }
  } else { const nx = document.getElementById('next'); nx.onclick = factNext; nx.focus({ preventScroll:true }); }
}
function factPick(v){
  const F = fact, cur = F.qs[F.i]; if(F.answered) return;
  F.answered = true; F.pick = v;
  const ok = v === cur.truth; F.results.push(ok);
  if(ok){ F.score++; F.streak++; F.pts += 10 + (F.streak>=3?5:0); } else F.streak = 0;
  renderFact();
  if(settings.speak) speak((ok?'Correct! ':'Not quite. ')+'That answer was '+(cur.truth?'right. ':'wrong. The right answer is '+cur.correct+'. ')+cur.exp);
}
function factNext(){
  const F = fact; stopSpeak(); F.i++; F.answered = false; F.pick = null; F.spoken = false;
  if(F.i >= F.qs.length){
    const n = F.qs.length;
    renderScore({ mode:'Fact Check', headline:`${F.score} of ${n} correct`, sub:`${F.pts} points.`, stars:starsFor(F.score/n), pts:F.pts, bestKey:'best_fact_'+settings.band+'_'+settings.unit, bestVal:F.pts, again:startFact });
  } else { renderFact(); window.scrollTo(0,0); }
}

/* ---- Sort It ---- */
function startSort(){
  const opts = sortSetsFor(settings.band); if(!opts.length){ renderHome(); return; }
  const o = pick(opts), names = sample(Object.keys(o.s.cats), Math.min(3, Object.keys(o.s.cats).length));
  const lists = names.map(c=>shuffle(o.s.cats[c])), items = [];
  for(let i=0; items.length<8 && i<60; i++){ const l = lists[i%names.length]; if(l.length) items.push({ it:l.pop(), c:names[i%names.length] }); }
  sortG = { u:o.u, s:o.s, cats:names, items:shuffle(items), i:0, score:0, pts:0, streak:0, results:[], answered:false, pick:null };
  renderSort();
}
function renderSort(){
  const G = sortG, cur = G.items[G.i], done = G.answered, last = G.i === G.items.length-1;
  const ok = done && G.cats[G.pick] === cur.c;
  const btns = G.cats.map((c,k)=>{ let cls = ''; if(done){ cls = c===cur.c ? 'right' : (k===G.pick ? 'wrong' : 'dim'); }
    return `<button class="ans a${k%4} ${cls}" data-k="${k}" ${done?'disabled':''}><span>${esc(c)}</span></button>`; }).join('');
  app.innerHTML = top(true) + `<div class="wrap">
    <div class="qbar"><span>Item ${G.i+1} of ${G.items.length}</span><span>${G.pts} points${G.streak>=2?` <span class="streak">🔥 ${G.streak} in a row</span>`:''}</span></div>
    <div class="track">${trackHTML(G.results, G.i, G.items.length)}</div>
    <div class="card qcard"><p class="sub" style="margin:0">Where does this go?</p><div class="sortitem">${esc(cap(cur.it))}</div>
      <div class="answers ${G.cats.length===3?'three':''}">${btns}</div>
      ${done?`<div class="feedback ${ok?'good':'bad'}"><strong>${ok?'Yes!':'Not quite.'}</strong>${esc(G.s.exp(cur.it, cur.c))}</div>`:''}
      ${done && !ok?`<div class="row nextrow"><button class="btn blue" id="next">${last?'See my results':'Next'}</button></div>`:''}
    </div></div>`;
  bindGear();
  if(!done){ app.querySelectorAll('.ans').forEach(b=>b.onclick=()=>sortPick(+b.dataset.k)); }
  else if(!ok){ const nx = document.getElementById('next'); nx.onclick = sortNext; nx.focus({ preventScroll:true }); }
}
function sortPick(k){
  const G = sortG, cur = G.items[G.i]; if(G.answered) return;
  G.answered = true; G.pick = k;
  const ok = G.cats[k] === cur.c; G.results.push(ok);
  if(ok){ G.score++; G.streak++; G.pts += 10 + (G.streak>=3?5:0); } else G.streak = 0;
  renderSort();
  if(ok) advTimer = setTimeout(sortNext, 900);
}
function sortNext(){
  const G = sortG; if(!G) return;
  G.i++; G.answered = false; G.pick = null;
  if(G.i >= G.items.length){
    const n = G.items.length;
    renderScore({ mode:'Sort It', headline:`${G.score} of ${n} sorted right`, sub:`${G.pts} points.`, stars:starsFor(G.score/n), pts:G.pts, bestKey:'best_sort_'+settings.band+'_'+settings.unit, bestVal:G.pts, again:startSort });
  } else { renderSort(); window.scrollTo(0,0); }
}

function isNetworkErr(e){ return /fetch|network|timeout|load failed/i.test((e && e.message) || ''); }
function friendly(err){
  const m = (err && err.message) || String(err || '');
  if(err && (err.code==='PGRST205' || /Could not find the table|schema cache/i.test(m))) return "The database tables aren't set up yet. Run the setup SQL in Supabase, then refresh.";
  if(err && err.code==='NOPROFILE') return "Your account exists but its profile record is missing. Contact support.";
  if(/invalid api key|no api key|apikey/i.test(m)) return "The app's connection key is wrong or missing. Check SUPABASE_KEY at the top of the app code.";
  if(/Invalid login credentials/i.test(m)) return "That email and password don't match.";
  if(/already registered|already been registered/i.test(m)) return 'That email already has an account. Try signing in.';
  if(/Email not confirmed/i.test(m)) return 'Check your email and tap the confirmation link first.';
  if(/rate limit|too many/i.test(m)) return 'Too many tries. Wait a few minutes and try again.';
  if(/fetch|network|load failed/i.test(m)) return "Can't reach the sign-in service. Check your internet connection.";
  return m || 'Something went wrong. Try again.';
}
function entitled(a){
  if(!a) return false;
  if(a.status==='active' || a.status==='trialing') return true;
  return !!a.trialEnds && new Date(a.trialEnds) > new Date();
}
function trialLine(){
  if(!account) return '';
  if(account.status==='active') return 'Subscription: active';
  if(account.status==='trialing') return 'Subscription: in trial';
  const days = account.trialEnds ? Math.ceil((new Date(account.trialEnds) - new Date()) / 864e5) : 0;
  return days > 0 ? `Free trial: ${days} day${days===1?'':'s'} left` : 'Free trial ended';
}
function routeIntoApp(){
  if(settings && unitInfo(settings.unit) && BANDS[settings.band]) renderHome(); else renderSetup();
}

async function pushSettings(s, p){
  store.set('dirty', true);
  const { error } = await sb.from('teacher_settings').upsert(
    { user_id: sessionUser.id, band:s.band, unit:s.unit, rounds:s.rounds, speak:s.speak, pin:p, updated_at:new Date().toISOString() },
    { onConflict:'user_id' });
  if(error) throw error;
  store.set('dirty', false);
}

async function loadAccount(){
  const uid = sessionUser.id;
  const p = await sb.from('profiles').select('email,subscription_status,trial_ends_at').eq('id', uid).maybeSingle();
  if(p.error) throw p.error;
  if(!p.data){ const e = new Error('missing-profile'); e.code = 'NOPROFILE'; throw e; }
  const s = await sb.from('teacher_settings').select('band,unit,rounds,speak,pin').eq('user_id', uid).maybeSingle();
  if(s.error) throw s.error;
  account = { email: p.data.email || sessionUser.email, status: p.data.subscription_status, trialEnds: p.data.trial_ends_at };
  store.set('acct', { uid, at: Date.now(), account });
  const remote = Object.assign({}, DEFAULTS, s.data || {});
  const localSettings = store.get('settings', null);
  if(store.get('dirty', false) && localSettings){
    settings = localSettings; pin = store.get('pin', remote.pin);
    try{ await pushSettings(settings, pin); }catch(e){ /* stays dirty, retried next time */ }
    return;
  }
  pin = remote.pin; store.set('pin', pin);
  const untouched = !s.data || (remote.band===DEFAULTS.band && remote.unit===DEFAULTS.unit && remote.rounds===DEFAULTS.rounds && remote.speak===DEFAULTS.speak && remote.pin===DEFAULTS.pin);
  if(untouched){ settings = null; store.set('settings', null); }
  else { settings = { band:remote.band, unit:remote.unit, rounds:remote.rounds, speak:remote.speak }; store.set('settings', settings); }
}

async function enterApp(){
  renderLoading('Loading your account...');
  try{ await loadAccount(); }
  catch(e){
    const c = store.get('acct', null);
    if(isNetworkErr(e) && c && sessionUser && c.uid===sessionUser.id && Date.now()-c.at < 7*864e5){
      account = c.account; settings = store.get('settings', null); pin = store.get('pin', '1234');
    } else { renderLoadError(e); return; }
  }
  if(!entitled(account)){ renderPaywall(); return; }
  routeIntoApp();
}

async function doSignOut(){
  try{ await sb.auth.signOut({ scope:'local' }); }catch(e){}
  try{ Object.keys(localStorage).filter(k=>k.indexOf('sq_')===0).forEach(k=>localStorage.removeItem(k)); }catch(e){}
  settings = null; pin = '1234'; account = null; sessionUser = null; recovering = false;
  renderAuth('in');
}

function renderLoading(msg){ show(authTop()+`<div class="wrap center" style="padding-top:60px"><p class="sub">${esc(msg)}</p></div>`); }
function renderConfigError(msg){ show(authTop()+`<div class="wrap" style="max-width:540px"><div class="card"><h2>Can't start</h2><p>${esc(msg)}</p><div class="row"><button class="btn go" id="retry">Refresh</button></div></div></div>`); document.getElementById('retry').onclick=()=>location.reload(); }
function renderLoadError(e){
  show(authTop()+`<div class="wrap" style="max-width:540px"><div class="card"><h2>We couldn't load your account</h2><p>${esc(friendly(e))}</p><div class="row"><button class="btn go" id="again">Try again</button><button class="btn plain" id="out">Sign out</button></div></div></div>`);
  document.getElementById('again').onclick=enterApp;
  document.getElementById('out').onclick=doSignOut;
}
function renderPaywall(){
  show(authTop()+`<div class="wrap" style="max-width:540px"><div class="card center"><div style="font-size:52px">⏰</div><h1>Your free trial has ended</h1>
    <p class="sub">${esc(account && account.email || '')}</p>
    <p>Subscription checkout is being set up. Once it's open, you'll be able to subscribe here and pick up right where you left off.</p>
    <div class="row"><button class="btn go" id="again">Check again</button><button class="btn plain" id="out">Sign out</button></div></div></div>`);
  document.getElementById('again').onclick=enterApp;
  document.getElementById('out').onclick=doSignOut;
}
function renderCheckEmail(email){
  show(authTop()+`<div class="wrap" style="max-width:540px"><div class="card center"><div style="font-size:52px">📬</div><h1>Check your email</h1>
    <p>We sent a confirmation link to <strong>${esc(email)}</strong>. Tap it, then come back and sign in. It can take a few minutes, and it may land in spam.</p>
    <div class="row"><button class="btn go" id="back">Back to sign in</button></div></div></div>`);
  document.getElementById('back').onclick=()=>renderAuth('in');
}

function renderAuth(mode, notice){
  mode = mode || 'in';
  const signin = mode==='in';
  show(authTop()+`<div class="wrap" style="max-width:540px">
    <h1>${signin?'Welcome back':'Start your free trial'}</h1>
    <p class="sub">${signin?'Sign in to open Bench Boost on this device.':'Create a teacher account. Your 14-day trial starts right away.'}</p>
    <div class="card">
      <div class="chips"><button class="chip ${signin?'on':''}" data-m="in">Sign in</button><button class="chip ${!signin?'on':''}" data-m="up">Create account</button></div>
      ${notice?`<div class="sendok">${esc(notice)}</div>`:''}
      ${field('aEmail','Email','email','inputmode="email" autocomplete="email" placeholder="you@school.org"')}
      ${field('aPass','Password','password',`autocomplete="${signin?'current-password':'new-password'}" placeholder="${signin?'Your password':'At least 8 characters'}"`)}
      <p class="err" id="aErr" style="display:none"></p>
      <div class="row" style="margin-top:16px"><button class="btn go" id="aGo">${signin?'Sign in':'Create account'}</button></div>
      ${signin?`<p class="hint"><button class="linkbtn" id="aForgot">Forgot your password?</button></p>`:''}
    </div></div>`);
  const err = document.getElementById('aErr'), go_ = document.getElementById('aGo');
  const showErr = m => { err.textContent = m; err.style.display = 'block'; };
  const busy = on => { go_.disabled = on; go_.textContent = on ? 'Working...' : (signin?'Sign in':'Create account'); };
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>renderAuth(b.dataset.m));
  const fg = document.getElementById('aForgot'); if(fg) fg.onclick=renderReset;
  async function submit(){
    const email = document.getElementById('aEmail').value.trim(), pass = document.getElementById('aPass').value;
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showErr('Enter a valid email address.');
    if(signin && !pass) return showErr('Enter your password.');
    if(!signin && pass.length < 8) return showErr('Use a password with at least 8 characters.');
    err.style.display = 'none'; busy(true);
    try{
      if(signin){
        const { data, error } = await sb.auth.signInWithPassword({ email, password:pass });
        if(error) throw error;
        sessionUser = data.user || (data.session && data.session.user);
        await enterApp();
      } else {
        const opts = redirectUrl() ? { emailRedirectTo: redirectUrl() } : {};
        const { data, error } = await sb.auth.signUp({ email, password:pass, options:opts });
        if(error) throw error;
        if(data.user && data.user.identities && data.user.identities.length===0) throw new Error('User already registered');
        if(data.session){ sessionUser = data.session.user; await enterApp(); }
        else renderCheckEmail(email);
      }
    }catch(e){ busy(false); showErr(friendly(e)); }
  }
  go_.onclick = submit;
  ['aEmail','aPass'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } }));
  document.getElementById('aEmail').focus();
}

function renderReset(){
  show(authTop()+`<div class="wrap" style="max-width:540px"><h1>Reset your password</h1>
    <p class="sub">Enter your account email and we'll send a link to choose a new password.</p><div class="card">
    ${field('rEmail','Email','email','inputmode="email" autocomplete="email"')}
    <p class="err" id="rErr" style="display:none"></p><div class="sendok" id="rOk" style="display:none"></div>
    <div class="row" style="margin-top:16px"><button class="btn go" id="rGo">Send reset link</button><button class="btn plain" id="rBack">Back to sign in</button></div></div></div>`);
  document.getElementById('rBack').onclick=()=>renderAuth('in');
  document.getElementById('rGo').onclick=async()=>{
    const email = document.getElementById('rEmail').value.trim(), err = document.getElementById('rErr'), ok = document.getElementById('rOk');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ err.textContent='Enter a valid email address.'; err.style.display='block'; return; }
    err.style.display='none';
    try{
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: redirectUrl() });
      if(error && (isNetworkErr(error) || /rate|too many/i.test(error.message))) throw error;
      ok.textContent = "If that email has an account, a reset link is on its way. It can take a few minutes."; ok.style.display='block';
    }catch(e){ err.textContent = friendly(e); err.style.display='block'; }
  };
}

function renderNewPassword(){
  show(authTop()+`<div class="wrap" style="max-width:540px"><h1>Choose a new password</h1><div class="card">
    ${field('nPass','New password','password','autocomplete="new-password" placeholder="At least 8 characters"')}
    ${field('nPass2','Type it again','password','autocomplete="new-password"')}
    <p class="err" id="nErr" style="display:none"></p>
    <div class="row" style="margin-top:16px"><button class="btn go" id="nGo">Save password</button></div></div></div>`);
  document.getElementById('nGo').onclick=async()=>{
    const a = document.getElementById('nPass').value, b = document.getElementById('nPass2').value, err = document.getElementById('nErr');
    const bad = m => { err.textContent = m; err.style.display='block'; };
    if(a.length < 8) return bad('Use a password with at least 8 characters.');
    if(a !== b) return bad("The two passwords don't match.");
    try{
      const { error } = await sb.auth.updateUser({ password:a });
      if(error) throw error;
      recovering = false;
      const { data } = await sb.auth.getSession();
      if(data && data.session){ sessionUser = data.session.user; await enterApp(); } else renderAuth('in', 'Password updated. Sign in with your new password.');
    }catch(e){ bad(friendly(e)); }
  };
}

function accountCardHTML(confirmOut){
  if(!account) return '';
  return `<div class="card"><h2>Account</h2><p style="margin:0;font-weight:700">${esc(account.email||'')}</p><p class="hint" style="margin-top:4px">${esc(trialLine())}</p>
    <div class="row" style="margin-top:12px">${confirmOut
      ? `<button class="btn warn" id="signoutYes">Sign out and clear this device</button><button class="btn plain" id="signoutNo">Stay signed in</button>`
      : `<button class="btn plain" id="signout">Sign out</button>`}</div>
    <p class="hint">Signing out removes your settings and any saved reports from this device.</p></div>`;
}

async function boot(){
  if(!window.supabase || !window.supabase.createClient){ renderConfigError("Couldn't load the sign-in service. Check your internet connection and refresh."); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });
  sb.auth.onAuthStateChange((event, session)=>{
    if(event==='PASSWORD_RECOVERY'){ sessionUser = session && session.user; recovering = true; renderNewPassword(); }
  });
  renderLoading('Loading...');
  let res;
  try{ res = await sb.auth.getSession(); }catch(e){ res = { data:{ session:null } }; }
  if(recovering) return;
  const session = res && res.data && res.data.session;
  if(session){ sessionUser = session.user; await enterApp(); } else renderAuth('in');
}

    document.getElementById('pinIn').oninput=e=>{ pinDraft = e.target.value; };

/* ---------- PIN ---------- */
function renderPin(onOk){
  let entry = '';
  function paint(shake){
    app.innerHTML = top(false) + `<div class="wrap center">
      <h1>Teacher PIN</h1><p class="sub">Enter the 4-digit PIN to change settings.</p>
      <div class="dots ${shake?'shake':''}">${[0,1,2,3].map(i=>`<i class="${i<entry.length?'f':''}"></i>`).join('')}</div>
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join('')}
        <button id="back" aria-label="Back to student mode">✕</button><button data-n="0">0</button><button id="del" aria-label="Delete">⌫</button></div>
    </div>`;
    app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{
      if(entry.length>=4) return;
      entry += b.dataset.n;
      if(entry.length===4){
        if(entry===pin){ go(onOk); return; }
        entry=''; paint(true); return;
      }
      paint(false);
    });
    document.getElementById('del').onclick=()=>{ entry=entry.slice(0,-1); paint(false); };
    document.getElementById('back').onclick=()=>go(settings?renderHome:renderSetup);
  }
  paint(false);
}

/* ---------- quiz ---------- */
function startQuiz(){
  const qs = draw(settings.rounds);
  quiz = { qs, i:0, score:0, pts:0, streak:0, results:[], answered:false, pick:null, spoken:false };
  renderQuiz();
}
function readQuestion(cur){ speak(cur.q + '. ' + cur.opts.map((o,k)=>'ABCD'[k]+'. '+o).join('. ')); }
function renderQuiz(){
  const Q = quiz, cur = Q.qs[Q.i], mix = settings.unit.startsWith('mix');
  const right = Q.answered && cur.opts[Q.pick]===cur.correct;
  const track = Q.qs.map((_,k)=>`<i class="${k<Q.results.length?(Q.results[k]?'ok':'no'):(k===Q.i?'now':'')}"></i>`).join('');
  const answers = cur.opts.map((o,k)=>{
    let c = '';
    if(Q.answered){ c = o===cur.correct ? 'right' : (k===Q.pick ? 'wrong' : 'dim'); }
    return `<button class="ans a${k%4} ${c}" data-k="${k}" ${Q.answered?'disabled':''}><span class="spot">${'ABCD'[k]}</span><span>${esc(o)}</span></button>`;
  }).join('');
  const last = Q.i===Q.qs.length-1;
  app.innerHTML = top(true) + `<div class="wrap">
    <div class="qbar"><span>Question ${Q.i+1} of ${Q.qs.length}</span><span>${Q.pts} points${Q.streak>=2?` <span class="streak">🔥 ${Q.streak} in a row</span>`:''}</span></div>
    <div class="track">${track}</div>
    <div class="card qcard">
      <div class="qhead"><div>${(mix||cur.extra)?`<span class="qtag">${cur.extra?'Review: ':''}${cur.icon} ${esc(cur.unit)}</span>`:''}<p class="qtext">${esc(cur.q)}</p></div>
      ${canSpeak?`<button class="speak" id="say" aria-label="Read question aloud">🔊</button>`:''}</div>
      <div class="answers">${answers}</div>
      ${Q.answered?`<div class="feedback ${right?'good':'bad'}"><strong>${right?['Nice!','You got it!','Great job!','Awesome!'][Q.i%4]:'Not quite.'}</strong>${right?'':'The answer is '+esc(cur.correct)+'. '}${esc(cur.exp)}</div>
        <div class="row nextrow"><button class="btn blue" id="next">${last?'See my results':'Next question'}</button></div>`:''}
    </div>
  </div>`;
  bindGear();
  const say = document.getElementById('say'); if(say) say.onclick=()=>readQuestion(cur);
  app.querySelectorAll('.ans').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  const nx = document.getElementById('next'); if(nx){ nx.onclick=nextQ; nx.focus({preventScroll:true}); }
  if(!Q.answered && settings.speak && !Q.spoken){ Q.spoken = true; readQuestion(cur); }
}
function answer(k){
  const Q = quiz, cur = Q.qs[Q.i]; if(Q.answered) return;
  Q.answered = true; Q.pick = k;
  const ok = cur.opts[k]===cur.correct;
  Q.results.push(ok);
  if(ok){ Q.score++; Q.streak++; Q.pts += 10 + (Q.streak>=3?5:0); } else { Q.streak = 0; }
  renderQuiz();
  if(settings.speak) speak((ok?'Correct! ':'Not quite. The answer is '+cur.correct+'. ')+cur.exp);
}
function nextQ(){
  const Q = quiz; stopSpeak();
  Q.i++; Q.answered=false; Q.pick=null; Q.spoken=false;
  if(Q.i>=Q.qs.length) go(renderResult); else { renderQuiz(); window.scrollTo(0,0); }
}
function renderResult(){
  const Q = quiz, n = Q.qs.length, pct = Q.score/n;
  const stars = pct>=0.9?3:pct>=0.7?2:pct>=0.4?1:0;
  const prev = store.get(bestKey(), 0), isBest = Q.pts>prev;
  if(isBest) store.set(bestKey(), Q.pts);
  const msg = ["Every expert started somewhere. Try another round!","Nice effort! Play again to beat your score.","Great work! You're almost a pro.","Superstar! You really know your stuff."][stars];
  const u = unitInfo(settings.unit);
  app.innerHTML = top(true) + `<div class="wrap"><div class="card center" style="padding:30px 20px">
    <div class="stars">${[0,1,2].map(i=>`<span class="${i<stars?'':'off'}">⭐</span>`).join('')}</div>
    <div class="scoreline">${Q.score} of ${n} correct</div>
    <p class="sub" style="margin:6px 0 0">${Q.pts} points. ${msg}</p>
    ${isBest?`<div class="newbest">New personal best!</div>`:''}
  </div>
  <div class="row"><button class="btn go" id="again">Play again</button><button class="btn blue" id="toRep">Sideline Reporter</button><button class="btn plain" id="home">Home</button></div>
  ${sendBoxHTML('qz','')}
  </div>`;
  bindGear();
  if(settings.speak) speak(Q.score+' of '+n+' correct. '+msg);
  document.getElementById('again').onclick=()=>go(startQuiz);
  document.getElementById('toRep').onclick=()=>go(startReporter);
  document.getElementById('home').onclick=()=>go(renderHome);
  bindSendBox('qz',
    name => `Bench Boost results: ${name}`,
    name => [
      `Student: ${name}`,
      `Unit: ${u.name} (${BANDS[settings.band]})`,
      `Score: ${Q.score} of ${n} correct`,
      `Points: ${Q.pts}`,
      `Date: ${new Date().toLocaleString([], {dateStyle:'medium', timeStyle:'short'})}`
    ].join('\n')
  );
}

/* ---------- sideline reporter ---------- */
function startReporter(){
  const list = PROMPTS[settings.band];
  rep = { step:-1, name:'', items:[], picks:shuffle(list).slice(0,3) };
  renderReporter();
}
function renderReporter(){
  const R = rep, k2 = settings.band==='k2';
  if(R.step===-1){
    app.innerHTML = top(true) + `<div class="wrap"><div class="card">
      <h1>Sideline Reporter</h1><p class="sub">You'll watch your class and answer 3 quick questions about what you see.</p>
      <label for="nm" style="font-weight:700">Your first name</label>
      <input class="text" id="nm" maxlength="30" autocomplete="off" style="margin-top:8px" placeholder="Type your first name">
      <div class="row" style="margin-top:16px"><button class="btn go" id="begin">Start reporting</button><button class="btn plain" id="home">Home</button></div>
    </div></div>`;
    bindGear();
    if(settings.speak) speak("Sideline Reporter. Type your first name, then start reporting.");
    document.getElementById('begin').onclick=()=>{ R.name=document.getElementById('nm').value.trim(); R.step=0; go(renderReporter); };
    document.getElementById('home').onclick=()=>go(renderHome);
    return;
  }
  if(R.step>=R.picks.length){
    const reportTime = Date.now();
    const reports = store.get('reports', []);
    reports.unshift({ t:reportTime, name:R.name, band:settings.band, unit:unitInfo(settings.unit).name, items:R.items });
    store.set('reports', reports.slice(0,200));
    app.innerHTML = top(true) + `<div class="wrap"><div class="card center" style="padding:30px 20px">
      <div style="font-size:60px">📝</div><h1>Report saved</h1><p class="sub">Great observing${R.name?', '+esc(R.name):''}! Your teacher can read it here on this device, or you can email it below.</p></div>
      <div class="row"><button class="btn blue" id="toQuiz">Quiz Challenge</button><button class="btn go" id="again">New report</button><button class="btn plain" id="home">Home</button></div>
      ${sendBoxHTML('rep', R.name)}
      </div>`;
    bindGear();
    if(settings.speak) speak("Report saved. Great observing!");
    document.getElementById('toQuiz').onclick=()=>go(startQuiz);
    document.getElementById('again').onclick=()=>go(startReporter);
    document.getElementById('home').onclick=()=>go(renderHome);
    bindSendBox('rep',
      name => `Bench Boost Sideline Report: ${name}`,
      name => [
        `Student: ${name}`,
        `Unit: ${unitInfo(settings.unit).name} (${BANDS[settings.band]})`,
        `Date: ${new Date(reportTime).toLocaleString([], {dateStyle:'medium', timeStyle:'short'})}`,
        '',
        ...R.items.flatMap(it => [it.p, it.a, ''])
      ].join('\n'),
      () => { store.set('reports', store.get('reports', []).filter(r => r.t !== reportTime)); }
    );
    return;
  }
  const P = R.picks[R.step];
  const promptText = k2 ? P.p : P;
  const dots = R.picks.map((_,i)=>`<i class="${i<R.step?'done':''}"></i>`).join('');
  app.innerHTML = top(true) + `<div class="wrap"><div class="card">
    <div class="stepdots">${dots}</div>
    <div class="qhead"><p class="qtext">${esc(promptText)}</p>${canSpeak?`<button class="speak" id="say" aria-label="Read aloud">🔊</button>`:''}</div>
    ${k2 ? `<div class="choices">${P.c.map((c,i)=>`<button class="emo" data-i="${i}">${esc(c)}</button>`).join('')}</div>`
         : `<textarea id="obs" style="margin-top:16px" placeholder="Write what you see..."></textarea>
            <div class="row" style="margin-top:14px"><button class="btn go" id="save">Save and continue</button><button class="btn plain" id="skip">Skip this one</button></div>`}
  </div></div>`;
  bindGear();
  const say = document.getElementById('say'); if(say) say.onclick=()=>speak(promptText + (k2 ? '. ' + P.c.join('. ') : ''));
  if(settings.speak) speak(promptText + (k2 ? '. ' + P.c.join('. ') : ''));
  const advance = a=>{ R.items.push({ p:promptText, a }); R.step++; go(renderReporter); };
  if(k2){ app.querySelectorAll('.emo').forEach(b=>b.onclick=()=>advance(P.c[+b.dataset.i])); }
  else{
    document.getElementById('save').onclick=()=>{ const v=document.getElementById('obs').value.trim(); advance(v||'(no answer)'); };
    document.getElementById('skip').onclick=()=>advance('(skipped)');
  }
}

/* ---------- teacher: reports ---------- */
function renderReports(){
  let confirmClear = false;
  function paint(){
    const reports = store.get('reports', []);
    const list = reports.length ? reports.map(r=>`<div class="rep-item">
        <div class="who">${esc(r.name||'No name')}</div>
        <div class="meta">${new Date(r.t).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'})}. ${esc(BANDS[r.band]||'')}, ${esc(r.unit)}</div>
        <dl>${r.items.map(it=>`<dt>${esc(it.p)}</dt><dd>${esc(it.a)}</dd>`).join('')}</dl></div>`).join('')
      : `<div class="card"><p class="sub" style="margin:0">No reports yet. Reports appear here after a student finishes Sideline Reporter on this device.</p></div>`;
    app.innerHTML = top(false) + `<div class="wrap">
      <h1>Sideline reports</h1><p class="sub">Saved on this device only. Newest first.</p>
      ${list}
      <div class="row" style="margin-top:8px">
        <button class="btn plain" id="back">Back to setup</button>
        ${reports.length ? (confirmClear
          ? `<button class="btn warn" id="yes">Delete all ${reports.length} reports</button><button class="btn plain" id="no">Keep them</button>`
          : `<button class="btn plain" id="clear" style="color:var(--red)">Clear reports</button>`) : ''}
      </div></div>`;
    document.getElementById('back').onclick=()=>go(renderSetup);
    const c=document.getElementById('clear'); if(c) c.onclick=()=>{ confirmClear=true; paint(); };
    const y=document.getElementById('yes'); if(y) y.onclick=()=>{ store.set('reports', []); confirmClear=false; paint(); };
    const n=document.getElementById('no'); if(n) n.onclick=()=>{ confirmClear=false; paint(); };
  }
  paint();
}

/* ---------- start ---------- */
boot();
})();
</script>
